async function backupCollections(collectionNames, filePrefix) {
  const btn = document.getElementById('backup-btn');
  const statusEl = document.getElementById('backup-status');
  if (btn) { btn.textContent = 'Backing up…'; btn.disabled = true; }
  if (statusEl) { statusEl.style.display = 'block'; statusEl.innerHTML = '<div style="font-size:12px;color:var(--text2)">Collecting data…</div>'; }

  try {
    const backup = {
      metadata: {
        exportedAt: new Date().toISOString(),
        exportedBy: CD?.name || 'Admin',
        projectId: 'swl-checklist',
        collections: collectionNames,
        version: '1.0'
      },
      data: {}
    };

    let totalDocs = 0;
    for (const colName of collectionNames) {
      if (statusEl) statusEl.innerHTML = `<div style="font-size:12px;color:var(--text2)">Exporting ${colName}…</div>`;
      try {
        const snap = await db.collection(colName).get();
        backup.data[colName] = {};
        snap.docs.forEach(d => {
          // Convert Firestore timestamps to ISO strings for portability
          const data = d.data();
          const cleaned = cleanForExport(data);
          backup.data[colName][d.id] = cleaned;
        });
        totalDocs += snap.size;
      } catch(e) {
        backup.data[colName] = { _error: `Could not export: ${e.message}` };
      }
    }

    // Create download
    const json = JSON.stringify(backup, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const now = new Date();
    const dateStr = now.toISOString().split('T')[0];
    const timeStr = now.toTimeString().slice(0,5).replace(':','-');
    a.download = `${filePrefix}_${dateStr}_${timeStr}.json`;
    a.href = url;
    a.click();
    URL.revokeObjectURL(url);

    if (statusEl) {
      statusEl.innerHTML = `
        <div style="background:var(--success-l);border:1px solid #A7F3D0;border-radius:var(--r);padding:10px 14px;font-size:13px">
          <strong style="color:var(--success)">✓ Backup downloaded successfully</strong><br>
          <span style="font-size:12px;color:var(--text2)">${totalDocs} documents exported from ${collectionNames.length} collection(s) · ${(json.length/1024).toFixed(1)} KB</span><br>
          <span style="font-size:11px;color:var(--text3)">File: ${a.download} · Save this to your OneDrive backup folder</span>
        </div>`;
    }

    // Log the backup
    try {
      await db.collection('sync_log').add({
        userId: CU.uid, userName: CD.name,
        action: 'data_backup',
        details: `Exported ${totalDocs} docs from: ${collectionNames.join(', ')}`,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      });
    } catch(e) { /* silent */ }

    toast(`✓ Backup downloaded — ${totalDocs} records`);

  } catch(e) {
    if (statusEl) statusEl.innerHTML = `<div style="background:var(--danger-l);border:1px solid #FECACA;border-radius:var(--r);padding:10px 14px;font-size:13px;color:var(--danger)">Error: ${esc(e.message)}</div>`;
    toast('Backup failed: ' + e.message, 'err');
  } finally {
    if (btn) { btn.textContent = 'Download Full Backup (JSON)'; btn.disabled = false; }
  }
}

function cleanForExport(data) {
  // Recursively convert Firestore special types to plain JS
  if (data === null || data === undefined) return data;
  if (typeof data !== 'object') return data;
  if (data.toDate && typeof data.toDate === 'function') {
    // Firestore Timestamp
    return data.toDate().toISOString();
  }
  if (Array.isArray(data)) return data.map(cleanForExport);
  const result = {};
  Object.entries(data).forEach(([k, v]) => { result[k] = cleanForExport(v); });
  return result;
}

function previewRestore(input) {
  const file = input.files[0];
  if (!file) return;
  const nameEl = document.getElementById('restore-filename');
  const previewEl = document.getElementById('restore-preview');
  if (nameEl) nameEl.textContent = file.name;

  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const backup = JSON.parse(e.target.result);
      const meta = backup.metadata || {};
      const collections = Object.keys(backup.data || {});
      const totalDocs = collections.reduce((sum, col) => {
        return sum + Object.keys(backup.data[col] || {}).length;
      }, 0);

      if (previewEl) {
        previewEl.style.display = 'block';
        previewEl.innerHTML = `
          <div style="background:var(--warn-l);border:1px solid #FDE68A;border-radius:var(--r);padding:14px 16px">
            <div style="font-size:13px;font-weight:700;color:var(--warn);margin-bottom:10px">⚠ Restore Preview — Review before proceeding</div>
            <div style="font-size:12px;color:var(--text2);line-height:1.8;margin-bottom:12px">
              <div><strong>Exported:</strong> ${esc(meta.exportedAt||'Unknown')}</div>
              <div><strong>Exported by:</strong> ${esc(meta.exportedBy||'Unknown')}</div>
              <div><strong>Collections:</strong> ${esc(collections.join(', '))}</div>
              <div><strong>Total records:</strong> ${totalDocs}</div>
            </div>
            ${collections.map(col => {
              const count = Object.keys(backup.data[col]||{}).length;
              return `<div style="font-size:12px;padding:4px 0;border-bottom:1px solid #FDE68A">
                <strong>${esc(col)}</strong>: ${count} documents
              </div>`;
            }).join('')}
            <div style="margin-top:14px;display:flex;gap:8px">
              <button class="btn danger" onclick="confirmRestore(${JSON.stringify(JSON.stringify(backup)).slice(0,10)})" 
                onclick="restoreFromBackup(this._backup)" 
                style="cursor:pointer"
                data-backup='${JSON.stringify(backup).replace(/'/g,"&#39;")}'>
                ⚠ Restore This Backup
              </button>
              <button class="btn" onclick="document.getElementById('restore-preview').style.display='none'">Cancel</button>
            </div>
            <div style="font-size:11px;color:var(--danger);margin-top:8px;font-weight:500">Warning: Restoring will overwrite current data in these collections. This cannot be undone.</div>
          </div>`;

        // Attach the full backup to the restore button
        const restoreBtn = previewEl.querySelector('[data-backup]');
        if (restoreBtn) {
          restoreBtn.onclick = () => restoreFromData(backup);
        }
      }
    } catch(e) {
      if (previewEl) {
        previewEl.style.display = 'block';
        previewEl.innerHTML = `<div style="background:var(--danger-l);border:1px solid #FECACA;border-radius:var(--r);padding:10px 14px;font-size:13px;color:var(--danger)">Invalid backup file: ${esc(e.message)}</div>`;
      }
    }
  };
  reader.readAsText(file);
}

async function restoreFromData(backup) {
  if (!confirm('⚠️ This will overwrite existing data. Are you absolutely sure?')) return;
  if (!confirm('Second confirmation: this CANNOT be undone. Proceed with restore?')) return;

  const statusEl = document.getElementById('backup-status');
  if (statusEl) { statusEl.style.display='block'; statusEl.innerHTML='<div style="font-size:12px;color:var(--text2)">Restoring…</div>'; }

  try {
    const collections = Object.keys(backup.data || {});
    let totalRestored = 0;

    for (const colName of collections) {
      const docs = backup.data[colName];
      if (!docs || typeof docs !== 'object') continue;
      const entries = Object.entries(docs);
      if (statusEl) statusEl.innerHTML = `<div style="font-size:12px;color:var(--text2)">Restoring ${colName} (${entries.length} docs)…</div>`;

      // Batch write in groups of 500 (Firestore limit)
      for (let i = 0; i < entries.length; i += 400) {
        const batch = db.batch();
        entries.slice(i, i+400).forEach(([docId, data]) => {
          const ref = db.collection(colName).doc(docId);
          batch.set(ref, data);
        });
        await batch.commit();
        totalRestored += Math.min(400, entries.length - i);
      }
    }

    if (statusEl) statusEl.innerHTML = `
      <div style="background:var(--success-l);border:1px solid #A7F3D0;border-radius:var(--r);padding:10px 14px;font-size:13px">
        <strong style="color:var(--success)">✓ Restore complete</strong><br>
        <span style="font-size:12px;color:var(--text2)">${totalRestored} documents restored across ${collections.length} collection(s)</span>
      </div>`;
    toast(`✓ Restored ${totalRestored} records`);

  } catch(e) {
    if (statusEl) statusEl.innerHTML = `<div style="background:var(--danger-l);border:1px solid #FECACA;border-radius:var(--r);padding:10px 14px;font-size:13px;color:var(--danger)">Restore failed: ${esc(e.message)}</div>`;
    toast('Restore failed: ' + e.message, 'err');
  }
}

async function uploadUserPhoto(uid, input) {
  const file = input.files[0];
  if (!file) return;
  if (!file.type.startsWith('image/')) { toast('Please select an image file','err'); return; }
  if (file.size > 500000) { toast('Image must be under 500KB','err'); return; }
  const reader = new FileReader();
  reader.onload = async (e) => {
    const dataURL = e.target.result;
    await db.collection('users').doc(uid).update({ photoURL: dataURL });
    toast('✓ Photo uploaded');
    renderAdmin();
  };
  reader.readAsDataURL(file);
}

async function toggleUser(uid, active) {
  await db.collection('users').doc(uid).update({ active: !active });
  try {
    const uSnap = await db.collection('users').doc(uid).get();
    await db.collection('sync_log').add({
      action: active ? 'user_disabled' : 'user_enabled',
      targetUid: uid,
      targetName: uSnap.data()?.name || uid,
      by: CD.name, byUid: CU.uid, byRole: CD.role,
      at: new Date().toISOString(),
      ts: firebase.firestore.FieldValue.serverTimestamp()
    });
  } catch(e) { /* audit log failure is non-critical */ }
  toast('User ' + (active ? 'disabled' : 'enabled')); renderAdmin();
}

async function createUserProfile() {
  const uid      = document.getElementById('nu-uid').value.trim();
  const name     = document.getElementById('nu-name').value.trim();
  const email    = document.getElementById('nu-email').value.trim();
  const role     = document.getElementById('nu-role').value;
  const branch   = document.getElementById('nu-branch').value;
  const formType = document.getElementById('nu-formtype').value;
  const result   = document.getElementById('nu-result');

  if (!uid)    { toast('Firebase UID is required','err'); return; }
  if (!name)   { toast('Full name is required','err'); return; }
  if (!email)  { toast('Email is required','err'); return; }
  if (!role)   { toast('Role is required','err'); return; }
  if (!branch) { toast('Branch is required','err'); return; }

  // Determine the correct formType if not manually set
  const autoFormType = formType || (
    role === 'branch_manager'        ? 'bm'    :
    role === 'ops_manager'           ? 'om'    :
    role === 'ops_specialist'        ? 'os'    :
    role === 'irrigation_supervisor' ? 'sv'    :
    role === 'client_rep' || role === 'client_rep_2' ? (branch==='LA'?'cr-la':'cr-oc') : 'cr-oc'
  );

  const actualRole = role === 'client_rep_2' ? 'client_rep' : role;

  try {
    await db.collection('users').doc(uid).set({
      name, email,
      role: actualRole,
      branch,
      formType: autoFormType,
      active: true,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    // Show success inline
    if (result) {
      result.style.display = 'block';
      result.innerHTML = `<div style="background:var(--success-l);border:1px solid #A7F3D0;border-radius:var(--r);padding:10px 14px;font-size:13px;color:var(--success)">
        <strong>✓ Profile created for ${esc(name)}</strong><br>
        <span style="font-size:11px;color:var(--text2)">Role: ${ROLES[actualRole]?.label||actualRole} · Branch: ${branch} · Form: ${autoFormType}</span><br>
        <span style="font-size:11px;color:var(--text3)">They can now log in with their Firebase Auth email and password.</span>
      </div>`;
    }

    toast('✓ User profile created for ' + name);

    // Clear form
    ['nu-uid','nu-name','nu-email'].forEach(id => document.getElementById(id).value = '');

    // Refresh user list
    setTimeout(() => renderAdmin(), 800);

  } catch(e) {
    toast('Error: ' + e.message, 'err');
    if (result) {
      result.style.display = 'block';
      result.innerHTML = `<div style="background:var(--danger-l);border:1px solid #FECACA;border-radius:var(--r);padding:10px 14px;font-size:13px;color:var(--danger)">Error: ${esc(e.message)}</div>`;
    }
  }
}

async function updateUserProfile() {
  const uid    = document.getElementById('nu-uid').value.trim();
  const name   = document.getElementById('nu-name').value.trim();
  const email  = document.getElementById('nu-email').value.trim();
  const role   = document.getElementById('nu-role').value;
  const branch = document.getElementById('nu-branch').value;
  const formType = document.getElementById('nu-formtype').value;
  const result = document.getElementById('nu-result');

  if (!uid) { toast('Firebase UID is required to update','err'); return; }

  const updates = {};
  if (name)   updates.name   = name;
  if (email)  updates.email  = email;
  if (role)   updates.role   = role === 'client_rep_2' ? 'client_rep' : role;
  if (branch) updates.branch = branch;
  if (formType) updates.formType = formType;

  try {
    await db.collection('users').doc(uid).update(updates);
    toast('✓ Profile updated');
    if (result) {
      result.style.display = 'block';
      result.innerHTML = `<div style="background:var(--success-l);border:1px solid #A7F3D0;border-radius:var(--r);padding:10px 14px;font-size:13px;color:var(--success)">✓ Profile updated successfully.</div>`;
    }
    setTimeout(() => renderAdmin(), 800);
  } catch(e) {
    toast('Error: ' + e.message, 'err');
  }
}

async function computeBadges(uid,role){
  // Only admin-awarded badges displayed — no auto-earned
  const badges=[];
  try{
    const aSnap=await db.collection('user_badges').where('userId','==',uid).get();
    aSnap.docs.forEach(d=>{
      const b=d.data();
      badges.push('__awarded__:' + (b.badgeIcon||'🏅') + '|' + (b.badgeName||'Badge'));
    });
  }catch(e){}
  return badges;
}
function renderBadgeChips(ids){
  if(!ids?.length)return'<span style="font-size:12px;color:var(--text3);font-style:italic">Keep submitting to earn badges!</span>';
  return ids.map(id=>{
    // Admin-awarded badges encoded as '__awarded__:icon|name'
    if(typeof id==='string' && id.startsWith('__awarded__:')){
      const parts=id.slice(12).split('|');
      const icon=parts[0]||'🏅';
      const name=parts.slice(1).join('|')||'Badge';
      return'<span class="badge-chip gold" title="Awarded by manager">'+icon+' '+esc(name)+'</span>';
    }
    // Auto-earned badges mapped to BADGES constant
    const b=BADGES[id];
    return b?'<span class="badge-chip '+b.cls+'" title="'+b.desc+'">'+b.icon+' '+b.label+'</span>':'';
  }).join('');
}

// ═══ SCENE — time of day + canvas trees ═══
function getTimeOfDay(){
  const h=new Date().getHours();
  if(h>=5&&h<7)return'dawn';if(h>=7&&h<11)return'morning';
  if(h>=11&&h<14)return'midday';if(h>=14&&h<17)return'afternoon';
  if(h>=17&&h<19)return'sunset';if(h>=19&&h<21)return'dusk';
  return'night';
}

function initLoginScene(){
  const scene=document.getElementById('ls-scene');
  if(!scene)return;
  const tod=getTimeOfDay();
  scene.className='ls-scene '+tod;

  // Stars
  const starsEl=document.getElementById('ls-stars');
  if(starsEl){for(let i=0;i<120;i++){const s=document.createElement('div');s.className='ls-star';const sz=.5+Math.random()*2;s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*65}%;width:${sz}px;height:${sz}px;animation-duration:${2+Math.random()*4}s;animation-delay:${Math.random()*4}s`;starsEl.appendChild(s);}}

  // Grass
  const grassEl=document.getElementById('ls-grass');
  if(grassEl){
    const gc=['#2d6a18','#3a7a22','#488a2a','#568e30','#246015','#3d7a20','#52922e','#2a5e14','#406018','#5a9a30','#1e5510','#4a8828'];
    for(let i=0;i<300;i++){const b=document.createElement('div');b.className='ls-blade';const h=10+Math.random()*62,w=1.5+Math.random()*3,lean=(Math.random()-.5)*26,delay=Math.random()*3,dur=1.2+Math.random()*2.2,col=gc[Math.floor(Math.random()*gc.length)];b.style.cssText=`height:${h}px;width:${w}px;background:linear-gradient(0deg,${col} 0%,${col}99 60%,${col}44 100%);--lean:${lean}deg;animation-delay:${delay}s;animation-duration:${dur}s;margin:0 ${.3+Math.random()*.8}px`;grassEl.appendChild(b);}
  }

  // Flowers
  const flEl=document.getElementById('ls-flowers');
  if(flEl){
    const fdefs=[['#e8344a','#ffd700',5,8],['#f4a0c0','#ffe080',5,7],['#a0c8f0','#fff0a0',6,6],['#f8e040','#ff8020',5,9],['#d060e0','#fffbe0',6,6],['#ff8040','#ffe080',5,7],['#ffffff','#ffe066',5,7],['#ff6090','#fff080',5,8],['#ff4444','#ffee00',6,7],['#88ddff','#fffde0',5,6]];
    for(let i=0;i<70;i++){
      const def=fdefs[Math.floor(Math.random()*fdefs.length)];
      const[pCol,cCol,petals,sz]=def;
      const wrap=document.createElement('div');wrap.className='ls-flower';
      const left=2+Math.random()*96,stemH=10+Math.random()*30,delay=5+Math.random()*10;
      wrap.style.cssText=`left:${left}%;animation-delay:${delay}s`;
      let petSvg='';
      for(let p=0;p<petals;p++){const a=(360/petals)*p;const ps=sz*(.7+Math.random()*.4);petSvg+=`<ellipse cx="${sz*1.3}" cy="0" rx="${ps*.7}" ry="${ps*.42}" fill="${pCol}" opacity="${.8+Math.random()*.2}" transform="rotate(${a} 0 0)" style="animation:petalOpen 3s cubic-bezier(.34,1.2,.64,1) ${delay+.4}s both;--pr:${a}deg"/>`;}
      wrap.innerHTML=`<div style="animation:flowerGrow 9s cubic-bezier(.34,1.3,.64,1) ${delay+.5}s both;transform-origin:bottom center"><svg width="${sz*3.8}" height="${sz*3.8}" viewBox="${-sz*2} ${-sz*2} ${sz*4} ${sz*4}" overflow="visible">${petSvg}<circle cx="0" cy="0" r="${sz*.52}" fill="${cCol}"/></svg></div><div style="width:2px;height:${stemH}px;background:#3a6a20;border-radius:1px;margin:0 auto"></div>`;
      flEl.appendChild(wrap);
    }
  }

  // Canvas trees — draw 3 trees + bushes using canvas API
  const canvas=document.getElementById('ls-canvas');
  if(!canvas)return;
  const W=window.innerWidth,H=window.innerHeight;
  canvas.width=W;canvas.height=H;
  const ctx=canvas.getContext('2d');
  canvas.style.height=H+'px';

  // Draw a tree at position x (0-1 of width), height h, trunk width tw
  function drawTree(xRatio,treeH,tw,leafDark,leafMid,leafBright,delay){
    setTimeout(()=>{
      const x=W*xRatio,baseY=groundY;
      // Trunk
      ctx.strokeStyle='#6b4423';ctx.lineWidth=tw;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(x,baseY);
      ctx.bezierCurveTo(x-tw/3,baseY-treeH*.35,x+tw/4,baseY-treeH*.6,x,baseY-treeH*.78);
      ctx.stroke();
      // Bark highlight
      ctx.strokeStyle='#9b7040';ctx.lineWidth=tw*.55;ctx.globalAlpha=.4;
      ctx.beginPath();ctx.moveTo(x,baseY);
      ctx.bezierCurveTo(x-tw/3,baseY-treeH*.35,x+tw/4,baseY-treeH*.6,x,baseY-treeH*.78);
      ctx.stroke();ctx.globalAlpha=1;
      // Branches
      const midY=baseY-treeH*.48;
      ctx.strokeStyle='#6b4423';ctx.lineWidth=tw*.52;
      ctx.beginPath();ctx.moveTo(x,midY);ctx.quadraticCurveTo(x-treeH*.22,midY-treeH*.1,x-treeH*.38,midY-treeH*.22);ctx.stroke();
      ctx.beginPath();ctx.moveTo(x,midY*1.05);ctx.quadraticCurveTo(x+treeH*.2,midY*.96,x+treeH*.36,midY*.86);ctx.stroke();
      ctx.lineWidth=tw*.38;
      ctx.beginPath();ctx.moveTo(x,midY*.9);ctx.quadraticCurveTo(x-treeH*.15,midY*.82,x-treeH*.26,midY*.74);ctx.stroke();
      ctx.beginPath();ctx.moveTo(x,midY*.9);ctx.quadraticCurveTo(x+treeH*.14,midY*.83,x+treeH*.24,midY*.76);ctx.stroke();
      // Foliage layers
      const tops=[[0,treeH*.84,treeH*.38,treeH*.3],[- treeH*.3,treeH*.56,treeH*.22,treeH*.18],[treeH*.28,treeH*.52,treeH*.24,treeH*.19],[0,treeH*.5,treeH*.18,treeH*.14],[- treeH*.22,treeH*.38,treeH*.14,treeH*.11],[treeH*.2,treeH*.35,treeH*.15,treeH*.12],[0,treeH*.3,treeH*.14,treeH*.1]];
      const cols=[leafDark,leafDark,leafDark,leafMid,leafMid,leafMid,leafBright,leafBright];
      tops.forEach(([ox,oy,rx,ry],i)=>{ctx.fillStyle=cols[Math.min(i,cols.length-1)];ctx.beginPath();ctx.ellipse(x+ox,baseY-oy,rx,ry,0,0,Math.PI*2);ctx.fill();});
      // Highlight spots
      ctx.fillStyle=leafBright;ctx.globalAlpha=.6;
      [[-treeH*.14,treeH*.9],[ treeH*.1,treeH*.88],[0,treeH*.96]].forEach(([ox,oy])=>{ctx.beginPath();ctx.arc(x+ox,baseY-oy,treeH*.06,0,Math.PI*2);ctx.fill();});
      ctx.globalAlpha=1;
    },delay);
  }

  // Draw a bush at x,y with radius r
  function drawBush(cx2,by,r,c1,c2,c3,delay){
    setTimeout(()=>{
      const by2=groundY;
      [[r*.95,by2,c1],[r*.75,by2-r*.15,c2],[r*.55,by2-r*.28,c3],[r*.38,by2-r*.42,c3]].forEach(([rx,y,col])=>{ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(cx2,y,rx,rx*.62,0,0,Math.PI*2);ctx.fill();});
      ctx.fillStyle=c1;[[cx2-r*.6,by2-r*.1,r*.35],[cx2+r*.55,by2-r*.08,r*.32]].forEach(([bx,by3,br])=>{ctx.beginPath();ctx.arc(bx,by3,br,0,Math.PI*2);ctx.fill();});
    },delay);
  }

  // Ground level = 78% down the canvas (22% from bottom is the ground)
  const groundY = H * 0.78;
  // Tree heights relative to canvas height
  // 3 main foreground trees
  drawTree(.08, H*.55, 22,'#0f2a0f','#1e4a1e','#3a8a3a', 500);
  drawTree(.50, H*.62, 28,'#0d280d','#1a451a','#348a34', 200);
  drawTree(.92, H*.52, 20,'#102a10','#1e481e','#388838', 800);
  // 2 mid-ground trees (smaller)
  drawTree(.26, H*.42, 15,'#122812','#1c3c1c','#2e6e2e',1400);
  drawTree(.74, H*.40, 14,'#122a12','#1c3e1c','#2c6c2c',1600);
  // Far background trees (very small, sit on hills)
  drawTree(.15, H*.28, 9,'#1a301a','#264026','#386838',2000);
  drawTree(.62, H*.26, 8,'#1a301a','#264026','#386838',2200);
  drawTree(.85, H*.30, 9,'#1a301a','#264026','#386838',2400);

  // Bushes scattered across base
  const bY=groundY;
  const bd=['#1a4a1a','#246024','#2d7a2d'],bm=['#1e521e','#2a6a2a','#328232'],bs=['#205220','#2a6a2a','#368236'];
  [[.02,bY,38,bd],[.18,bY,28,bm],[.30,bY,22,bs],[.38,bY,32,bd],[.48,bY,24,bm],
   [.58,bY,28,bs],[.68,bY,34,bd],[.78,bY,26,bm],[.88,bY,22,bs],[.96,bY,30,bd],
   [.12,bY,20,bs],[.42,bY,18,bm],[.72,bY,22,bs]].forEach(([xr,y,r,cols],i)=>{
    drawBush(W*xr,y,r,cols[0],cols[1],cols[2],3000+i*120);
  });

  // Fireflies (night)
  if(tod==='night'||tod==='dusk'){
    for(let i=0;i<14;i++){
      const ff=document.createElement('div');ff.className='ls-ff';
      const dur=4+Math.random()*4,bDur=1.5+Math.random()*2;
      ff.style.cssText=`left:${8+Math.random()*84}%;bottom:${25+Math.random()*30}%;animation-duration:${dur}s,${bDur}s;animation-delay:${Math.random()*4}s,${Math.random()*2}s`;
      scene.appendChild(ff);
    }
  }
}

// ── Content theme (NEW) ──
function setContentTheme(mode,btn){
  var ca=document.querySelector(".content-area");
  if(ca)ca.classList.toggle("theme-white",mode==="white");
  document.querySelectorAll(".ts-opt").forEach(function(b){b.classList.remove("on");});
  if(btn)btn.classList.add("on");
  if(CU)localStorage.setItem("swl_theme_"+CU.uid,mode);
}


// ═══ CHANGE ROLE MODAL ═══
function showChangeRole(uid, currentRole, userName) {
  const roleOptions = Object.entries(ROLES).map(([k,v]) =>
    '<option value="'+k+'"'+(k===currentRole?' selected':'')+'>'+v.label+'</option>'
  ).join('');
  const modal = document.createElement('div');
  modal.id = 'change-role-modal';
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:9999;display:flex;align-items:center;justify-content:center';
  modal.innerHTML = '<div style="background:#242424;border:1px solid #333;border-radius:12px;padding:24px;width:400px;max-width:90vw">'
    + '<div style="font-size:15px;font-weight:700;color:#F0F0F0;margin-bottom:4px">Change Role</div>'
    + '<div style="font-size:12px;color:#888;margin-bottom:16px">'+esc(userName)+'</div>'
    + '<div style="margin-bottom:12px"><label style="font-size:11px;color:#888;display:block;margin-bottom:4px">New Role</label>'
    + '<select id="cr-new-role" style="width:100%;padding:8px 10px;background:#1E1E1E;border:1px solid #383838;border-radius:6px;color:#E0E0E0;font-size:13px">'+roleOptions+'</select></div>'
    + '<div style="margin-bottom:16px"><label style="font-size:11px;color:#888;display:block;margin-bottom:4px">New Branch</label>'
    + '<select id="cr-new-branch" style="width:100%;padding:8px 10px;background:#1E1E1E;border:1px solid #383838;border-radius:6px;color:#E0E0E0;font-size:13px">'
    + '<option value="OC">OC — Orange County</option><option value="LA">LA — Los Angeles</option><option value="ALL">ALL — Both Branches</option>'
    + '</select></div>'
    + '<div style="display:flex;gap:8px"><button class="btn primary" id="apply-role-btn">Save Change</button>'
    + '<button class="btn" id="cancel-role-btn">Cancel</button></div>'
    + '</div>';
  document.body.appendChild(modal);
  var applyBtn = document.getElementById('apply-role-btn');
  var cancelBtn = document.getElementById('cancel-role-btn');
  if(applyBtn) applyBtn.addEventListener('click', function() { applyRoleChange(uid, userName); });
  if(cancelBtn) cancelBtn.addEventListener('click', function() { var m=document.getElementById('change-role-modal'); if(m) m.remove(); });
}

async function applyRoleChange(uid, userName) {
  const newRole = document.getElementById('cr-new-role').value;
  const newBranch = document.getElementById('cr-new-branch').value;
  if (!newRole) return;
  try {
    // Get current role for audit log
    const userSnap = await db.collection('users').doc(uid).get();
    const oldRole = userSnap.data().role;
    // Update user
    await db.collection('users').doc(uid).update({ role: newRole, branch: newBranch });
    // Audit log
    await db.collection('sync_log').add({
      action: 'role_change', targetUser: uid, targetName: userName,
      oldRole, newRole, oldBranch: userSnap.data().branch, newBranch,
      changedBy: CU.uid, changedByName: CD.name,
      ts: firebase.firestore.FieldValue.serverTimestamp()
    });
    document.getElementById('change-role-modal').remove();
    toast('✓ Role updated for ' + userName);
    navigateTo('admin'); // refresh admin panel
  } catch(e) { toast('Error: ' + e.message, 'danger'); }
}

  el.innerHTML = '<div class="empty">Loading badges…</div>';
  try {

        + '<button class="btn" onclick="showCreateBadge()">+ Create Custom Badge</button>'
        + '</div>';

async function showAwardBadge(preselectedBadgeId) {
  const el = document.getElementById('badge-admin-content');
  if (!el) return;
  el.innerHTML = '<div style="color:#555;font-size:12px;padding:8px">Loading suggestions…</div>';

  const [badgeSnap, userSnap, subSnap, itemSnap] = await Promise.all([
    db.collection('badges').get(),
    db.collection('users').where('active','==',true).get(),
    db.collection('weekly_submissions').get(),
    db.collection('weekly_items').get()
  ]);

  const badges = badgeSnap.docs.map(d=>({id:d.id,...d.data()}));
  const users  = userSnap.docs.map(d=>({id:d.id,...d.data()})).filter(u=>u.role!=='admin');
  const subs   = subSnap.docs.map(d=>d.data());
  const items  = itemSnap.docs.map(d=>d.data());

  const stats = {};
  users.forEach(u => {
    const userSubs  = subs.filter(s=>s.userId===u.id && s.status==='submitted');
    const userItems = items.filter(i=>i.owner===u.id || i.ownerName===u.name);
    const weeks = [...new Set(userSubs.map(s=>s.weekStart))].sort();
    let streak=0, cur=0;
    for(let i=1;i<weeks.length;i++){
      const diff=Math.round((new Date(weeks[i])-new Date(weeks[i-1]))/(7*24*3600*1000));
      cur=diff===1?cur+1:0; streak=Math.max(streak,cur);
    }
    if(weeks.length>0) streak=Math.max(streak,1);
    const onTime  = userItems.filter(i=>i.status==='completed_on_time').length;
    const missed  = userItems.filter(i=>i.status==='not_completed').length;
    const overdue = userItems.filter(i=>i.status==='pending'&&i.deadline&&i.deadline<new Date().toISOString().split('T')[0]).length;
    const total   = userItems.length;
    stats[u.id] = {name:u.name,branch:u.branch,subCount:userSubs.length,streak,onTime,missed,overdue,total,rate:total?Math.round(onTime/total*100):null};
  });

  const suggestions = [];
  const seen = new Set();
  const addSug = (uid, badge, reason, suggestedBadge) => {
    if (!seen.has(uid) && stats[uid]) { seen.add(uid); suggestions.push({uid,name:stats[uid].name,branch:stats[uid].branch,badge,reason,suggestedBadge}); }
  };

  const topStreak = Object.entries(stats).sort((a,b)=>b[1].streak-a[1].streak)[0];
  if (topStreak && topStreak[1].streak>=3)
    addSug(topStreak[0],'🔥',topStreak[1].streak+'-week submission streak','4-Week Streak');

  const perfect = Object.entries(stats).filter(([,s])=>s.rate===100&&s.total>=3).sort((a,b)=>b[1].total-a[1].total);
  if (perfect.length)
    addSug(perfect[0][0],'✅',perfect[0][1].onTime+'/'+perfect[0][1].total+' items completed on time (100%)','Zero Miss Month');

  const clean = Object.entries(stats).filter(([,s])=>s.total>=2&&s.missed===0&&s.overdue===0&&s.rate!==null);
  if (clean.length)
    addSug(clean[0][0],'💎','Zero missed or overdue items across '+clean[0][1].total+' tasks','Reliability Champion');

  const topSub = Object.entries(stats).sort((a,b)=>b[1].subCount-a[1].subCount)[0];
  if (topSub && topSub[1].subCount>=5)
    addSug(topSub[0],'⭐',topSub[1].subCount+' total check-ins submitted','Consistency Star');

  const suggestHtml = suggestions.length
    ? '<div style="margin-bottom:16px">'
      + '<div style="font-size:11px;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px">&#128161; Suggested based on data &#8212; you decide who to award</div>'
      + suggestions.map(s=>
          '<div style="background:#1A1A1A;border:1px solid #2E2E2E;border-left:3px solid #FBBF24;border-radius:6px;padding:10px 12px;margin-bottom:8px;display:flex;align-items:center;gap:12px">'
          + '<div style="font-size:22px;flex-shrink:0">'+s.badge+'</div>'
          + '<div style="flex:1">'
          + '<div style="font-size:12px;font-weight:700;color:#E0E0E0">'+esc(s.name)+' <span style="font-size:10px;color:#777;font-weight:400">&middot; '+s.branch+'</span></div>'
          + '<div style="font-size:11px;color:#AAA;margin-top:2px">'+esc(s.reason)+'</div>'
          + '<div style="font-size:10px;color:#FBBF24;margin-top:3px">Suggested: '+esc(s.suggestedBadge)+'</div>'
          + '</div>'
          + '<button class="award-suggest-btn" data-uid="'+s.uid+'" style="padding:5px 12px;font-size:11px;font-weight:600;background:rgba(251,191,36,.12);color:#FBBF24;border:1px solid rgba(251,191,36,.25);border-radius:6px;cursor:pointer;white-space:nowrap;flex-shrink:0">Award &#8594;</button>'
          + '</div>'
        ).join('')
      + '</div>'
    : '';

  el.innerHTML = suggestHtml
    + '<div style="background:#1E1E1E;border:1px solid #333;border-radius:8px;padding:16px">'
    + '<div style="font-size:13px;font-weight:700;color:#E0E0E0;margin-bottom:12px">Award Badge</div>'
    + '<div class="fg" style="margin-bottom:10px"><label>Employee</label><select id="aw-user">'
    + users.map(u=>'<option value="'+u.id+'">'+esc(u.name)+' ('+u.branch+')</option>').join('')+'</select></div>'
    + '<div class="fg" style="margin-bottom:10px"><label>Badge</label><select id="aw-badge">'
    + badges.map(b=>'<option value="'+b.id+'"'+(b.id===preselectedBadgeId?' selected':'')+'>'+b.icon+' '+esc(b.name)+'</option>').join('')+'</select></div>'
    + '<div class="fg" style="margin-bottom:14px"><label>Note (optional)</label><textarea id="aw-note" rows="2" placeholder="Reason for awarding…"></textarea></div>'
    + '<div style="display:flex;gap:8px"><button class="btn primary" onclick="awardBadgeNow()">Award Badge</button><button class="btn" onclick="showBadgePanel()">Cancel</button></div>'
    + '</div>';

  el.querySelectorAll('.award-suggest-btn').forEach(function(btn) {
    btn.addEventListener('click', function() { prefillAward(this.dataset.uid); });
  });
}

function prefillAward(uid) {
  const sel = document.getElementById('aw-user');
  if (!sel) return;
  for (let i=0; i<sel.options.length; i++) {
    if (sel.options[i].value === uid) { sel.selectedIndex=i; break; }
  }
  sel.scrollIntoView({behavior:'smooth',block:'nearest'});
  toast('Employee selected — pick a badge and award');
}

async function loadExecBranch(branch) {
  const el = document.getElementById('exec-content');
  if (!el) return;
  el.innerHTML = '<div class="empty">Loading…</div>';
  const wk = weekKey(CW);
  var subQ = db.collection('weekly_submissions').where('weekStart','==',wk);
  if (branch!=='ALL') subQ = subQ.where('branch','==',branch);
  const snap = await subQ.get();
  const teamMembers = TEAM.filter(t=>branch==='ALL'||t.branch===branch);
  const sc = snap.docs.filter(d=>d.data().status==='submitted').length;
  const tc = teamMembers.length;
  const pct = tc ? Math.round(sc/tc*100) : 0;
  const accent = branch==='OC'?'#FC6020':branch==='LA'?'#1E88E5':'#4CAF50';
  el.innerHTML = '<div class="stats-grid" style="margin-bottom:14px">'
    +'<div class="stat-card" style="border-top:2.5px solid '+accent+'"><div class="stat-num">'+sc+'/'+tc+'</div><div class="stat-lbl">Submitted</div></div>'
    +'<div class="stat-card warn-stat"><div class="stat-num">'+(tc-sc)+'</div><div class="stat-lbl">Pending</div></div>'
    +'<div class="stat-card ok-stat"><div class="stat-num">'+pct+'%</div><div class="stat-lbl">Completion rate</div></div>'
    +'<div class="stat-card"><div class="stat-num">'+(branch==='ALL'?'Both':branch)+'</div><div class="stat-lbl">Branch</div></div>'
    +'</div>'
    +'<div class="card"><div class="card-header"><div class="card-title">Team Submission Status</div></div>'
    +'<div style="display:flex;flex-direction:column;gap:6px">'
    + teamMembers.map(t=>{
        const sub = snap.docs.find(d=>d.data().userId===t.uid&&d.data().status==='submitted');
        return '<div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #2E2E2E">'
          +'<div style="width:28px;height:28px;border-radius:50%;background:'+( ROLES[t.role]?.color||'#555')+';display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0">'+t.name.split(' ').map(n=>n[0]).slice(0,2).join('')+'</div>'
          +'<div style="flex:1"><div style="font-size:12px;font-weight:600;color:#E0E0E0">'+esc(t.name)+'</div><div style="font-size:10px;color:#777">'+(ROLES[t.role]?.label||t.role)+' · '+t.branch+'</div></div>'
          +'<span class="badge '+(sub?'success':'warn')+'">'+(sub?'✓ Submitted':'Pending')+'</span>'
          +'</div>';
      }).join('')
    +'</div></div>';
}

// Load weekly items inline in the check-in form
async function loadInlineWeeklyItems() {
  const el = document.getElementById('inline-weekly-items');
  if (!el) return;
  const wk = weekKey(CW);
  el.innerHTML = '<div style="color:#555;font-size:12px;padding:8px;font-style:italic">Loading&#8230;</div>';
  try {
    const [snapByUid, snapByName] = await Promise.all([
      db.collection('weekly_items').where('weekStart','==',wk).where('owner','==',CU.uid).get(),
      db.collection('weekly_items').where('weekStart','==',wk).where('ownerName','==',CD.name).get()
    ]);
    const seen = new Set();
    const allDocs = [...snapByUid.docs, ...snapByName.docs].filter(d => {
      if (seen.has(d.id)) return false; seen.add(d.id); return true;
    });
    if (!allDocs.length) {
      el.innerHTML = '<div style="color:#555;font-size:12px;padding:8px;font-style:italic">No weekly items assigned to you this week.</div>';
      return;
    }
    const extSnap = await db.collection('extension_requests')
      .where('requestedBy','==',CU.uid).where('weekStart','==',wk).get();
    const pendingExtMap = {};
    extSnap.docs.forEach(d => { pendingExtMap[d.data().itemId] = {id:d.id,...d.data()}; });
    const statusColors = { pending:'#60A5FA', in_progress:'#FBBF24', completed_on_time:'#7DC855', completed_late:'#7DC855', not_completed:'#C084FC', canceled_by_client:'#94A3B8' };
    const statusLabels = { pending:'Open', in_progress:'In Progress', completed_on_time:'Completed', completed_late:'Done Late', not_completed:'Carried Over', canceled_by_client:'Canceled by Client' };
    const today = new Date().toISOString().split('T')[0];
    el.innerHTML = allDocs.map(d => {
      const item = d.data();
      const color = statusColors[item.status] || '#888';
      const isPastDue = item.deadline && item.deadline < today && item.status === 'pending';
      const isCanceled = item.status === 'canceled_by_client';
      const isDone = ['completed_on_time','completed_late','canceled_by_client'].includes(item.status);
      const extInfo = pendingExtMap[d.id];
      const hasPendingExt = extInfo?.status === 'pending';
      const wasDenied = extInfo?.status === 'denied';
      const canRequestExt = !isDone && item.status !== 'not_completed' && !hasPendingExt;
      const safeTitle = esc(item.title).replace(/'/g,"\'");
      const extBtn = canRequestExt
        ? '<button onclick="openExtensionModal(\'' + d.id + '\',\'' + safeTitle + '\',\'' + (item.deadline||'') + '\')" style="padding:3px 9px;font-size:10px;font-weight:600;background:rgba(251,191,36,.12);color:#FBBF24;border:1px solid rgba(251,191,36,.25);border-radius:5px;cursor:pointer">' + (isPastDue?'\u26a0 Request Extension':'\ud83d\udcc5 Extend') + '</button>' : '';
      const borderColor = isCanceled?'rgba(148,163,184,.25)':isPastDue?'rgba(248,113,113,.35)':hasPendingExt?'rgba(251,191,36,.3)':'#2E2E2E';
      return '<div style="background:#1E1E1E;border:1px solid ' + borderColor + ';border-radius:6px;padding:10px 12px;margin-bottom:6px' + (isCanceled?';opacity:.7':'') + '">'
        + '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">'
        + '<div style="flex:1;min-width:0">'
        + '<div style="font-size:12px;font-weight:600;color:' + (isCanceled?'#94A3B8':'#E0E0E0') + ';' + (isCanceled?'text-decoration:line-through':'') + '">' + esc(item.title) + '</div>'
        + '<div style="font-size:10px;color:' + (isPastDue?'#F87171':'#777') + ';margin-top:1px">Due: <strong style="color:' + (isCanceled?'#94A3B8':isPastDue?'#F87171':'#AAA') + '">' + (item.deadline||'—') + '</strong>' + (isPastDue&&!isCanceled?' · <span style="color:#F87171;font-weight:700">PAST DUE</span>':'') + (item.extensionHistory?.length?' · <span style="color:#FBBF24">Extended '+item.extensionHistory.length+'x</span>':'') + '</div></div>'
        + '<div style="display:flex;align-items:center;gap:6px;flex-shrink:0">'
        + '<select data-item-id="' + d.id + '" style="padding:4px 7px;border-radius:5px;background:#2A2A2A;border:1px solid #3A3A3A;color:' + color + ';font-size:11px;font-weight:600;cursor:pointer" onchange="updateInlineItemStatus(this)">'
        + ['pending','in_progress','completed_on_time','completed_late','not_completed','canceled_by_client'].map(s=>'<option value="'+s+'"'+(item.status===s?' selected':'')+'>'+(statusLabels[s]||s)+'</option>').join('')
        + '</select>' + extBtn + '</div></div>'
        + '<div style="margin-top:7px">'
        + '<textarea data-note-id="' + d.id + '" rows="2" placeholder="' + (isCanceled?'Add cancelation details…':'Progress note or update…') + '" style="width:100%;padding:6px 9px;border-radius:5px;border:1px solid #333;background:#252525;color:#CCC;font-size:11px;font-family:inherit;resize:vertical">' + esc(item.latestNote||'') + '</textarea>'
        + '<button onclick="saveItemNote(\'' + d.id + '\')" style="margin-top:3px;padding:3px 10px;font-size:10px;font-weight:600;background:#2A2A2A;color:#888;border:1px solid #383838;border-radius:5px;cursor:pointer">Save Note</button>'
        + (item.latestNoteBy ? '<span style="font-size:10px;color:#555;margin-left:8px">Last update by ' + esc(item.latestNoteBy) + '</span>' : '')
        + '</div>'
        + (hasPendingExt?'<div class="ext-pending-banner">🔄 Extension pending approval &mdash; Proposed: <strong>'+(extInfo.proposedDeadline||'—')+'</strong></div>':'')
        + (wasDenied?'<div style="background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.2);border-radius:6px;padding:6px 10px;font-size:11px;color:#F87171;margin-top:4px">✕ Extension denied'+(extInfo.deniedReason?' &mdash; Manager: &ldquo;'+esc(extInfo.deniedReason)+'&rdquo;':'')+'</div>':'')
        + (item.managerUpdate?.note?'<div style="background:rgba(23,95,165,.1);border:1px solid rgba(23,95,165,.2);border-radius:6px;padding:6px 10px;font-size:11px;color:#60A5FA;margin-top:4px">&#128101; Manager: &ldquo;'+esc(item.managerUpdate.note)+'&rdquo;</div>':'')
        + '</div>';
    }).join('');
  } catch(e) {
    el.innerHTML = '<div style="color:#F87171;font-size:12px;padding:8px">Error: ' + e.message + '</div>';
    console.error(e);
  }
}
async function updateInlineItemStatus(sel) {
  const itemId = sel.dataset.itemId;
  const newStatus = sel.value;
  if (!itemId) return;
  const statusColors = {
    pending:'#60A5FA', in_progress:'#FBBF24',
    completed_on_time:'#7DC855', completed_late:'#7DC855',
    not_completed:'#C084FC', overdue:'#F87171'
  };

    await db.collection('weekly_items').doc(itemId).update({

      lastUpdated: firebase.firestore.FieldValue.serverTimestamp(),
      updatedBy: CU.uid
    });
    toast('Item status updated');
  } catch(e) { toast('Could not update: '+e.message,'danger'); }
}

async function saveExtensionRequest(itemId, itemTitle, currentDeadline) {
  const reason = document.getElementById('ext-reason')?.value?.trim();
  const proposedDeadline = document.getElementById('ext-new-deadline')?.value;
  if (!reason) { toast('Please explain why you need an extension','warn'); return; }
  if (!proposedDeadline) { toast('Please select a proposed new deadline','warn'); return; }
  if (proposedDeadline <= (currentDeadline||'')) { toast('New deadline must be after current deadline','warn'); return; }
  const btn = document.getElementById('ext-submit-btn');
  if (btn) { btn.textContent='Submitting…'; btn.disabled=true; }
  try {
    const itemSnap = await db.collection('weekly_items').doc(itemId).get();
    const item = itemSnap.data();
    if (!item.originalDeadline) {
      await db.collection('weekly_items').doc(itemId).update({originalDeadline:item.deadline||currentDeadline});
    }
    await db.collection('extension_requests').add({
      itemId, itemTitle,
      originalDeadline:item.originalDeadline||item.deadline||currentDeadline,
      proposedDeadline, reason,
      requestedBy:CU.uid, requestedByName:CD.name, requestedByRole:CD.role,
      branch:item.branch||CD.branch, weekStart:item.weekStart||weekKey(CW),
      status:'pending', createdAt:firebase.firestore.FieldValue.serverTimestamp()
    });
    await db.collection('weekly_items').doc(itemId).update({hasPendingExtension:true,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
    const modal = document.getElementById('ext-req-modal'); if (modal) modal.remove();
    toast('✓ Extension request submitted — manager will review it');
    loadInlineWeeklyItems();
  } catch(e) {
    toast('Error: '+e.message,'err');
    const b2 = document.getElementById('ext-submit-btn');
    if (b2) { b2.textContent='Submit Extension Request'; b2.disabled=false; }
  }
}

async function approveExtension(requestId, itemId, proposedDeadline, requestedByName, reason, originalDeadline) {
  try {
    const logEntry = {type:'extension_approved',by:CD.name,byRole:CD.role,requestedBy:requestedByName,reason,originalDeadline,newDeadline:proposedDeadline,approvedAt:new Date().toISOString()};
    await db.collection('extension_requests').doc(requestId).update({status:'approved',approvedBy:CU.uid,approvedByName:CD.name,approvedAt:firebase.firestore.FieldValue.serverTimestamp()});
    await db.collection('weekly_items').doc(itemId).update({deadline:proposedDeadline,hasPendingExtension:false,extensionHistory:firebase.firestore.FieldValue.arrayUnion(logEntry),updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
    toast('✓ Extension approved — deadline updated to '+proposedDeadline);
    renderAccountability();
  } catch(e) { toast('Error: '+e.message,'err'); }
}

async function denyExtension(requestId, itemId, requestedByName) {
  const reason = prompt('Reason for denying (shown to employee):') || '';
  try {
    await db.collection('extension_requests').doc(requestId).update({status:'denied',deniedBy:CU.uid,deniedByName:CD.name,deniedReason:reason,deniedAt:firebase.firestore.FieldValue.serverTimestamp()});
    await db.collection('weekly_items').doc(itemId).update({hasPendingExtension:false,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
    toast('Extension denied for '+requestedByName);
    renderAccountability();
  } catch(e) { toast('Error: '+e.message,'err'); }
}

async function loadAppreciationsForDash() {
  try {
    const snap = await db.collection('appreciations')
      .where('toUserId','==',CU.uid).get();
    if (snap.empty) return;
    const ca = document.getElementById('content-area');
    if (!ca) return;

    const allDocs = snap.docs.map(d=>({id:d.id,...d.data()}))
      .sort((a,b)=>{ // newest first
        const ta = a.sentAt?.toMillis?.() || 0;
        const tb = b.sentAt?.toMillis?.() || 0;
        return tb - ta;
      });
    const unreadDocs = allDocs.filter(a=>!a.read);

    const cards = allDocs.map(a => {
      const ts = a.sentAt?.toDate?.()?.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})||'';
      const toneIcon = a.tone ? a.tone.split(' ')[0] : '❤️';
      const isNew = !a.read;
      return '<div style="background:rgba(192,132,252,' + (isNew?'.1':'.05') + ');border:1px solid rgba(192,132,252,' + (isNew?'.35':'.15') + ');border-radius:10px;padding:14px 16px;margin-bottom:10px;position:relative">'
        + (isNew ? '<div style="position:absolute;top:12px;right:12px;background:#C084FC;color:#fff;font-size:9px;font-weight:700;padding:2px 7px;border-radius:10px;letter-spacing:.04em;text-transform:uppercase">NEW</div>' : '')
        + '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">'
        + '<span style="font-size:20px">' + toneIcon + '</span>'
        + '<div><div style="font-size:12px;font-weight:700;color:#C084FC">From ' + esc(a.fromName) + '</div>'
        + '<div style="font-size:10px;color:#777">' + ts + '</div></div>'
        + '</div>'
        + (a.tone ? '<div style="font-size:10px;color:#C084FC;margin-bottom:6px;font-weight:600">' + esc(a.tone) + '</div>' : '')
        + '<div style="font-size:13px;color:#E0E0E0;line-height:1.6">' + esc(a.message) + '</div>'
        + '</div>';
    }).join('');

    const headerText = unreadDocs.length
      ? '&#128140; Appreciations <span style="background:#C084FC;color:#fff;font-size:9px;font-weight:700;padding:2px 7px;border-radius:10px;margin-left:6px;vertical-align:middle">' + unreadDocs.length + ' NEW</span>'
      : '&#128140; Appreciations (' + allDocs.length + ')';

    const wrapper = document.createElement('div');
    wrapper.id = 'appreciation-banner';
    wrapper.innerHTML = '<div style="margin-bottom:16px">'
      + '<div style="font-size:11px;font-weight:700;color:#C084FC;text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px">' + headerText + '</div>'
      + cards
      + '</div>';
    ca.insertBefore(wrapper, ca.firstChild);

    // Mark unread as seen after 3 seconds (they stay visible — just removes NEW badge next visit)
    if (unreadDocs.length) {
      setTimeout(async function() {
        try {
          const batch = db.batch();
          unreadDocs.forEach(a => {
            batch.update(db.collection('appreciations').doc(a.id), {read: true});
          });
          await batch.commit();
        } catch(e) { /* silent — not critical */ }
      }, 3000);
    }
  } catch(e) { console.warn('loadAppreciationsForDash:', e.message); }
}

</script>
