<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SWL Operations Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
/* ═══════════════════════════════════════
   DESIGN TOKENS
═══════════════════════════════════════ */
:root {
  /* Brand */
  --burg:#7A1C2E; --burg2:#5E1522;
  --swl-green:#0E4C2D; --swl-green2:#0A3A22;
  --sage:#D3DED7;
  /* OC — Ducks */
  --oc:#FC4C02; --oc2:#C93D00; --oc-l:#FFF0E8; --oc-l2:#FFD5BA;
  /* LA — Dodgers */
  --la:#005A9C; --la2:#003F6E; --la-l:#E8F2FB; --la-l2:#BFDBF7;
  /* UI */
  --bg:#F1F3F4; --surface:#FFFFFF; --surface2:#F8F9FA; --surface3:#F0F2F0;
  --border:#E2E8E4; --border2:#C8D4CE;
  --text:#0D1B12; --text2:#3A4F43; --text3:#7A9088; --text4:#B0C4BB;
  --success:#059669; --success-l:#ECFDF5;
  --warn:#D97706; --warn-l:#FFFBEB;
  --danger:#DC2626; --danger-l:#FEF2F2;
  --info:#2563EB; --info-l:#EFF6FF;
  --critical:#7C3AED; --critical-l:#F5F3FF;
  /* Sidebar */
  --sb-bg:#0D1B12; --sb-border:rgba(255,255,255,.07);
  --sb-text:rgba(211,222,215,.7); --sb-active:#fff;
  /* Layout */
  --sb-w:220px;
  --r:6px; --rl:10px; --rxl:14px;
  --sh:0 1px 2px rgba(0,0,0,.06),0 1px 3px rgba(0,0,0,.04);
  --shm:0 4px 16px rgba(0,0,0,.10),0 1px 4px rgba(0,0,0,.06);
}

/* ═══════════════════════════════════════
   RESET + BASE
═══════════════════════════════════════ */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',system-ui,sans-serif;font-size:13px;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}

/* ═══════════════════════════════════════
   APP LAYOUT
═══════════════════════════════════════ */
#login-wrap{
  position:fixed;inset:0;background:var(--swl-green);
  display:flex;align-items:center;justify-content:center;
  z-index:1000;transition:opacity .3s,visibility .3s;
}
#login-wrap.hidden{opacity:0;visibility:hidden;pointer-events:none}

.app{display:flex;height:100vh;overflow:hidden}
.sidebar{
  width:var(--sb-w);flex-shrink:0;background:var(--sb-bg);
  display:flex;flex-direction:column;height:100vh;overflow:hidden;
  border-right:1px solid var(--sb-border);
}
.main-area{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.top-bar{
  height:52px;flex-shrink:0;background:var(--surface);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 20px;gap:12px;
}
.content-area{flex:1;overflow-y:auto;overflow-x:hidden;padding:20px}

/* ═══════════════════════════════════════
   LOGIN
═══════════════════════════════════════ */
.login-card{
  background:#fff;border-radius:16px;padding:36px;width:420px;
  box-shadow:0 24px 64px rgba(0,0,0,.25);position:relative;overflow:hidden;
}
.login-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--burg),var(--oc))}
.login-brand-name{font-size:20px;font-weight:700;color:var(--burg);letter-spacing:-.3px}
.login-brand-sub{font-size:12px;font-weight:600;color:var(--swl-green);margin-top:1px}
.login-tagline{font-size:12px;color:var(--text3);margin:12px 0 24px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.login-card h2{font-size:15px;font-weight:600;color:var(--text);margin-bottom:16px}
.lf{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.lf label{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.06em}
.lf input{font-size:13px;padding:10px 12px;border:1.5px solid var(--border2);border-radius:var(--r);font-family:inherit;color:var(--text);outline:none;transition:border-color .15s}
.lf input:focus{border-color:var(--swl-green);box-shadow:0 0 0 3px rgba(14,76,45,.08)}
#l-btn{width:100%;padding:11px;font-size:13px;font-weight:600;background:var(--swl-green);color:#fff;border:none;border-radius:var(--r);cursor:pointer;font-family:inherit;transition:background .15s;margin-top:4px}
#l-btn:hover{background:var(--swl-green2)}
#l-btn:disabled{opacity:.6;cursor:not-allowed}
#l-err{margin-top:12px;padding:10px 12px;background:var(--danger-l);border:1px solid #FECACA;border-radius:var(--r);color:var(--danger);font-size:12px;font-weight:500;display:none}
#l-err.show{display:block}

/* ═══════════════════════════════════════
   SIDEBAR
═══════════════════════════════════════ */
.sb-header{padding:16px;border-bottom:1px solid var(--sb-border)}
.sb-logo{font-size:13px;font-weight:700;color:#fff;line-height:1.3}
.sb-logo-sub{font-size:10px;color:var(--sb-text);margin-top:1px}
.sb-user{padding:12px 16px;border-bottom:1px solid var(--sb-border)}
.sb-user-name{font-size:12px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-user-role{font-size:11px;color:var(--sb-text);margin-top:2px}
.sb-branch-tag{display:inline-flex;align-items:center;margin-top:6px;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.sb-branch-tag.oc{background:var(--oc);color:#fff}
.sb-branch-tag.la{background:var(--la);color:#fff}
.sb-branch-tag.all{background:var(--burg);color:#fff}
.sb-nav{flex:1;overflow-y:auto;padding:8px 0}
.sb-section-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--sb-text);padding:12px 16px 4px;opacity:.5}
.nav-btn{
  display:flex;align-items:center;gap:9px;width:100%;padding:8px 16px;
  font-size:12px;font-weight:500;color:var(--sb-text);background:none;border:none;
  cursor:pointer;font-family:inherit;text-align:left;transition:all .12s;border-radius:0;
  position:relative;
}
.nav-btn:hover{color:#fff;background:rgba(255,255,255,.06)}
.nav-btn.active{color:#fff;background:rgba(255,255,255,.1)}
.nav-btn.active::before{content:'';position:absolute;left:0;top:4px;bottom:4px;width:3px;background:var(--oc);border-radius:0 2px 2px 0}
.nav-btn.active.la-nav::before{background:var(--la)}
.nav-btn svg{width:14px;height:14px;flex-shrink:0;opacity:.6}
.nav-btn.active svg,.nav-btn:hover svg{opacity:1}
.sb-footer{padding:12px 16px;border-top:1px solid var(--sb-border)}
.sb-week{font-size:10px;color:var(--sb-text);margin-bottom:8px;opacity:.7}
.sb-week-val{font-size:11px;color:#fff;font-weight:500}
.week-nav-btns{display:flex;gap:4px;margin-top:4px}
.week-nav-btns button{flex:1;padding:4px;font-size:11px;background:rgba(255,255,255,.08);color:var(--sb-text);border:none;border-radius:4px;cursor:pointer;font-family:inherit}
.week-nav-btns button:hover{background:rgba(255,255,255,.14);color:#fff}
.signout-btn{display:flex;align-items:center;gap:6px;width:100%;padding:6px 0;font-size:11px;color:var(--sb-text);background:none;border:none;cursor:pointer;font-family:inherit;margin-top:10px}
.signout-btn:hover{color:#fff}

/* ═══════════════════════════════════════
   TOP BAR
═══════════════════════════════════════ */
.tb-title{font-size:14px;font-weight:600;color:var(--text);flex:1}
.tb-week{font-size:12px;color:var(--text3);background:var(--surface2);padding:4px 10px;border-radius:20px;border:1px solid var(--border)}
.tb-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px}

/* ═══════════════════════════════════════
   SCREENS
═══════════════════════════════════════ */
.screen{display:none}
.screen.active{display:block}

/* ═══════════════════════════════════════
   DASHBOARD
═══════════════════════════════════════ */
.dash-greeting{font-size:22px;font-weight:700;color:var(--text);letter-spacing:-.4px;margin-bottom:2px}
.dash-sub{font-size:13px;color:var(--text3);margin-bottom:20px}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:16px;box-shadow:var(--sh);position:relative;overflow:hidden}
.stat-card::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px}
.stat-card.oc-stat::after{background:var(--oc)}
.stat-card.la-stat::after{background:var(--la)}
.stat-card.warn-stat::after{background:var(--warn)}
.stat-card.ok-stat::after{background:var(--success)}
.stat-num{font-size:28px;font-weight:700;letter-spacing:-1px;line-height:1;color:var(--text)}
.stat-lbl{font-size:11px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-top:4px}
.cards-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:18px;box-shadow:var(--sh)}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.card-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text3)}
.card.oc-card{border-top:3px solid var(--oc)}
.card.la-card{border-top:3px solid var(--la)}
.card.warn-card{border-top:3px solid var(--warn)}
.card.full{grid-column:1/-1}

/* ═══════════════════════════════════════
   PROGRESS BAR
═══════════════════════════════════════ */
.progress-wrap{margin-bottom:16px}
.progress-label{display:flex;justify-content:space-between;font-size:11px;color:var(--text3);margin-bottom:4px}
.progress-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;border-radius:3px;transition:width .4s cubic-bezier(.4,0,.2,1)}
.progress-fill.oc{background:var(--oc)}
.progress-fill.la{background:var(--la)}
.progress-fill.green{background:var(--success)}

/* ═══════════════════════════════════════
   BADGES + STATUS
═══════════════════════════════════════ */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
.badge.success{background:var(--success-l);color:var(--success);border:1px solid #A7F3D0}
.badge.warn{background:var(--warn-l);color:var(--warn);border:1px solid #FDE68A}
.badge.danger{background:var(--danger-l);color:var(--danger);border:1px solid #FECACA}
.badge.info{background:var(--info-l);color:var(--info);border:1px solid #BFDBFE}
.badge.critical{background:var(--critical-l);color:var(--critical);border:1px solid #DDD6FE}
.badge.oc{background:var(--oc-l);color:var(--oc2);border:1px solid var(--oc-l2)}
.badge.la{background:var(--la-l);color:var(--la2);border:1px solid var(--la-l2)}
.badge.neutral{background:var(--surface2);color:var(--text2);border:1px solid var(--border)}
.priority-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;display:inline-block}
.priority-dot.low{background:var(--success)}
.priority-dot.medium{background:var(--warn)}
.priority-dot.high{background:var(--danger)}
.priority-dot.critical{background:var(--critical)}

/* ═══════════════════════════════════════
   FORMS
═══════════════════════════════════════ */
.form-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);margin-bottom:12px;overflow:hidden;box-shadow:var(--sh)}
.form-section-hdr{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;cursor:pointer;user-select:none;
  border-bottom:1px solid transparent;transition:background .12s;
}
.form-section-hdr:hover{background:var(--surface2)}
.form-section-hdr.open{border-bottom-color:var(--border)}
.fsh-left{display:flex;align-items:center;gap:10px}
.fsh-icon{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.fsh-title{font-size:12px;font-weight:600;color:var(--text)}
.fsh-sub{font-size:11px;color:var(--text3);margin-top:1px}
.fsh-chevron{color:var(--text3);transition:transform .2s;font-size:12px}
.fsh-chevron.open{transform:rotate(180deg)}
.form-section-body{padding:16px;display:none}
.form-section-body.open{display:block}
.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.fg label{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:6px}
.fg input,.fg select,.fg textarea{font-size:13px;padding:8px 11px;border:1.5px solid var(--border2);border-radius:var(--r);background:var(--surface);color:var(--text);font-family:inherit;width:100%;transition:border-color .15s;outline:none}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--swl-green);box-shadow:0 0 0 3px rgba(14,76,45,.06)}
.fg textarea{resize:vertical;min-height:72px;line-height:1.6}
.fg .hint{font-size:11px;color:var(--text3)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px}
.req{color:var(--danger);margin-left:2px}

/* ═══════════════════════════════════════
   ROW TABLE (property/project entries)
═══════════════════════════════════════ */
.row-table{margin-top:10px}
.rt-header{display:grid;gap:8px;padding:5px 8px;background:var(--surface2);border-radius:4px 4px 0 0;border:1px solid var(--border)}
.rt-row{display:grid;gap:8px;padding:6px 8px;border:1px solid var(--border);border-top:none;background:var(--surface)}
.rt-row:last-child{border-radius:0 0 4px 4px}
.rt-header span{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text3)}
.rt-row input{font-size:12px;padding:5px 7px;border:1px solid var(--border2);border-radius:4px;background:var(--surface2);color:var(--text);font-family:inherit;width:100%;outline:none}
.rt-row input:focus{border-color:var(--swl-green);background:var(--surface)}
.rt-c3 .rt-header,.rt-c3 .rt-row{grid-template-columns:2fr 1fr 1fr}
.rt-c4 .rt-header,.rt-c4 .rt-row{grid-template-columns:2fr 1fr 1fr 1fr}
.add-row-btn{font-size:11px;color:var(--text3);background:none;border:1px dashed var(--border2);border-top:none;padding:5px;width:100%;cursor:pointer;font-family:inherit;border-radius:0 0 4px 4px;transition:all .12s}
.add-row-btn:hover{background:var(--surface2);color:var(--text2)}

/* ═══════════════════════════════════════
   BUTTONS
═══════════════════════════════════════ */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;font-size:12px;font-weight:600;border:1px solid var(--border2);border-radius:var(--r);background:var(--surface);color:var(--text);cursor:pointer;font-family:inherit;transition:all .12s;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--swl-green);color:#fff;border-color:var(--swl-green)}
.btn.primary:hover{background:var(--swl-green2)}
.btn.oc-btn{background:var(--oc);color:#fff;border-color:var(--oc)}
.btn.oc-btn:hover{background:var(--oc2)}
.btn.la-btn{background:var(--la);color:#fff;border-color:var(--la)}
.btn.la-btn:hover{background:var(--la2)}
.btn.danger{background:var(--danger-l);color:var(--danger);border-color:#FECACA}
.btn.sm{padding:5px 10px;font-size:11px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;padding-top:16px;border-top:1px solid var(--border)}

/* ═══════════════════════════════════════
   MONDAY SUMMARY
═══════════════════════════════════════ */
.summary-header{background:var(--swl-green);border-radius:var(--rxl);padding:20px 24px;margin-bottom:20px;color:#fff;position:relative;overflow:hidden}
.summary-header::before{content:'';position:absolute;right:-20px;top:-30px;width:200px;height:200px;background:rgba(255,255,255,.03);border-radius:50%}
.sum-title{font-size:20px;font-weight:700;letter-spacing:-.3px;margin-bottom:3px}
.sum-sub{font-size:12px;opacity:.7}
.sum-week-badge{display:inline-block;background:rgba(255,255,255,.12);padding:4px 12px;border-radius:20px;font-size:11px;font-weight:600;margin-top:8px}
.sum-branch-section{margin-bottom:24px}
.sum-branch-hdr{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding:10px 14px;border-radius:var(--r);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.sum-branch-hdr.oc{background:var(--oc-l);color:var(--oc2);border-left:4px solid var(--oc)}
.sum-branch-hdr.la{background:var(--la-l);color:var(--la2);border-left:4px solid var(--la)}
.sum-role-block{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);margin-bottom:10px;overflow:hidden;box-shadow:var(--sh)}
.sum-role-hdr{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--surface2)}
.sum-role-name{font-size:12px;font-weight:700;color:var(--text)}
.sum-role-status{margin-left:auto}
.sum-fields{padding:12px 14px}
.sum-field{margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.sum-field:last-child{border:none;margin-bottom:0;padding-bottom:0}
.sum-field-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-bottom:4px}
.sum-field-value{font-size:13px;color:var(--text);line-height:1.6;white-space:pre-wrap}
.sum-field-value.empty{color:var(--text4);font-style:italic}
.sum-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
.sum-table th{text-align:left;padding:5px 8px;background:var(--surface2);border-bottom:2px solid var(--border);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text3)}
.sum-table td{padding:5px 8px;border-bottom:1px solid var(--border);vertical-align:top}

/* ═══════════════════════════════════════
   ITEMS / CARRYOVER
═══════════════════════════════════════ */
.item-row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.item-row:last-child{border:none;padding-bottom:0}
.item-content{flex:1;min-width:0}
.item-title{font-size:13px;font-weight:500;color:var(--text);margin-bottom:2px}
.item-meta{font-size:11px;color:var(--text3)}
.team-member-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.team-member-row:last-child{border:none}
.tmr-avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.tmr-name{font-size:12px;font-weight:600;color:var(--text);flex:1}
.tmr-role{font-size:11px;color:var(--text3)}

/* ═══════════════════════════════════════
   ADMIN / SETTINGS
═══════════════════════════════════════ */
.settings-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.settings-row:last-child{border:none}
.sr-info{flex:1}
.sr-name{font-size:13px;font-weight:600;color:var(--text)}
.sr-meta{font-size:11px;color:var(--text3);margin-top:1px}
.sr-actions{display:flex;align-items:center;gap:6px}

/* ═══════════════════════════════════════
   TOAST
═══════════════════════════════════════ */
#toast{
  position:fixed;bottom:20px;right:20px;
  padding:10px 16px;border-radius:var(--rl);font-size:12px;font-weight:600;color:#fff;
  background:var(--swl-green);box-shadow:var(--shm);
  transform:translateY(80px);opacity:0;transition:all .25s cubic-bezier(.4,0,.2,1);z-index:2000;
}
#toast.show{transform:translateY(0);opacity:1}
#toast.err{background:var(--danger)}
#toast.warn{background:var(--warn)}

/* ═══════════════════════════════════════
   EMPTY STATE
═══════════════════════════════════════ */
.empty{text-align:center;padding:32px 20px;color:var(--text3);font-size:13px}
.empty-icon{font-size:28px;display:block;margin-bottom:8px;opacity:.4}

/* ═══════════════════════════════════════
   RESPONSIVE
═══════════════════════════════════════ */
@media(max-width:900px){
  .sidebar{display:none}
  .stats-grid{grid-template-columns:1fr 1fr}

// UTILITIES
// ══════════════════════════════════════════════════
function getMonday(d) {
  const dt = new Date(d); const day = dt.getDay();
  const diff = dt.getDate() - day + (day === 0 ? -6 : 1);
  dt.setDate(diff); dt.setHours(0,0,0,0); return dt;
}
function getSaturday(m) { const d = new Date(m); d.setDate(d.getDate()+5); return d; }
function fmtDate(d) {
  if (!d) return '—';
  const dt = d instanceof Date ? d : d.toDate ? d.toDate() : new Date(d);
  return dt.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}
function fmtShort(d) {
  if (!d) return '—';
  const dt = d instanceof Date ? d : d.toDate ? d.toDate() : new Date(d);
  return dt.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
}
function weekKey(m) { return new Date(m).toISOString().split('T')[0]; }
function fmtWeek(m) { return `${fmtShort(m)} – ${fmtShort(getSaturday(m))}`; }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function greet() { const h=new Date().getHours(); return h<12?'Good morning':h<17?'Good afternoon':'Good evening'; }
function isFriday() { return new Date().getDay()===5; }
function isMonday() { return new Date().getDay()===1; }
function getUserBranch() { return CD?.branch==='ALL' ? null : CD?.branch; }
function canView(branch) { if(!CD) return false; if(CD.role==='admin') return true; return CD.branch===branch; }

let toastT;
function toast(msg, type='ok') {
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = 'toast show' + (type!=='ok'?' '+type:'');
  clearTimeout(toastT); toastT = setTimeout(()=>el.classList.remove('show'), 3000);
}

function showErr(msg) {
  const el = document.getElementById('l-err');
  el.textContent = msg; el.classList.add('show');
}
function clearErr() { document.getElementById('l-err').classList.remove('show'); }

async function doLogin() {
  clearErr();
  const email = document.getElementById('l-email').value.trim();
  const pass  = document.getElementById('l-pass').value;
  const btn   = document.getElementById('l-btn');
  if (!email || !pass) { showErr('Please enter your email and password.'); return; }
  btn.textContent = 'Signing in…'; btn.disabled = true;
  try {
    const cred = await auth.signInWithEmailAndPassword(email, pass);
    const snap = await db.collection('users').doc(cred.user.uid).get();
    if (!snap.exists) { showErr('User profile not found. Contact admin.'); await auth.signOut(); btn.textContent='Sign In'; btn.disabled=false; return; }
    CD = snap.data();
    if (!CD.active) { showErr('Your account is disabled. Contact admin.'); await auth.signOut(); btn.textContent='Sign In'; btn.disabled=false; return; }
    CU = cred.user;
    enterApp();
  } catch(e) {
    const msgs = {
      'auth/invalid-credential':'Incorrect email or password.',
      'auth/user-not-found':'No account found with that email.',
      'auth/wrong-password':'Incorrect password.',
      'auth/too-many-requests':'Too many attempts. Please wait a few minutes.',
      'auth/network-request-failed':'Network error. Check your connection.'
    };
    showErr(msgs[e.code] || ('Error: ' + e.message));
    btn.textContent = 'Sign In'; btn.disabled = false;
  }
}

// Handle page refresh — restore session
auth.onAuthStateChanged(async user => {
  if (user && !CU) {
    try {
      const snap = await db.collection('users').doc(user.uid).get();
      if (snap.exists && snap.data().active) {
        CU = user; CD = snap.data(); enterApp();
      } else { auth.signOut(); }
    } catch(e) { /* network error on refresh, stay on login */ }
  } else if (!user && CU) {
    CU = null; CD = null; leaveApp();
  }
});

function enterApp() {
  document.getElementById('login-wrap').classList.add('hidden');
  document.getElementById('app-shell').style.display = 'flex';
  buildSidebar();
  updateWeekDisplay();
  navigateTo('dashboard');
}

function leaveApp() {
  document.getElementById('login-wrap').classList.remove('hidden');
  document.getElementById('app-shell').style.display = 'none';
}

async function doSignOut() {
  await auth.signOut();
  CU = null; CD = null; leaveApp();
  document.getElementById('l-btn').textContent = 'Sign In';
  document.getElementById('l-btn').disabled = false;
  document.getElementById('l-email').value = '';
  document.getElementById('l-pass').value = '';
}

document.getElementById('l-pass').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });

// NAVIGATION — NO scroll reset
// ══════════════════════════════════════════════════
function navigateTo(screen) {
  activeScreen = screen;
  // Update active nav btn
  document.querySelectorAll('.nav-btn').forEach(b => {
    b.classList.toggle('active', b.getAttribute('onclick')?.includes(`'${screen}'`));
  });
  // Scroll content area to top smoothly
  const ca = document.getElementById('content-area');
  ca.scrollTop = 0;
  // Render screen
  renderScreen(screen);
}

function prevWeek() { CW = new Date(CW); CW.setDate(CW.getDate()-7); updateWeekDisplay(); renderScreen(activeScreen); }
function nextWeek() { CW = new Date(CW); CW.setDate(CW.getDate()+7); updateWeekDisplay(); renderScreen(activeScreen); }
function updateWeekDisplay() {
  const wk = fmtWeek(CW);
  const el = document.getElementById('sb-week-val');
  const tb = document.getElementById('tb-week');
  if (el) el.textContent = wk;
  if (tb) tb.textContent = wk;
}

function renderScreen(screen) {
  const ca = document.getElementById('content-area');

  const screens = {

function getFirstCheckinRole() {
  // If user has a specific formType assigned (e.g. extra client rep), use that
  if (CD?.formType) return CD.formType;
  const r = CD?.role;
  if (r==='branch_manager') return 'bm';
  if (r==='ops_manager') return 'om';
  if (r==='ops_specialist') return 'os';
  if (r==='irrigation_supervisor') return 'sv';
  if (r==='client_rep') return CD?.branch==='LA' ? 'cr-la' : 'cr-oc';
  return 'bm';
}

function getWeekNum(d) {
  const start = new Date(d.getFullYear(),0,1);
  return Math.ceil((((d-start)/86400000)+start.getDay()+1)/7);
}

async function loadCarryoverForDash(branch) {
  let q = db.collection('weekly_items').where('status','==','not_completed');
  if (branch) q = q.where('branch','==',branch);
  const snap = await q.get();
  document.getElementById('ds-carryover').textContent = snap.size;
  const el = document.getElementById('dash-co-list');
  if (!el) return;
  if (snap.empty) { el.innerHTML='<div class="empty"><span class="empty-icon">✓</span>No carry-over items</div>'; return; }
  el.innerHTML = snap.docs.slice(0,5).map(d => {
    const it = d.data();
    return `<div class="item-row">
      <span class="priority-dot ${it.priority||'medium'}"></span>
      <div class="item-content">
        <div class="item-title">${esc(it.title)}</div>
        <div class="item-meta">${esc(it.ownerName)} · Was due ${fmtDate(it.deadline)}${it.fridayReview?.reason ? ' · ' + esc(it.fridayReview.reason) : ''}</div>
        ${it.fridayReview?.newDeadline ? `<div style="font-size:11px;color:var(--info);margin-top:2px">New deadline: ${fmtDate(it.fridayReview.newDeadline)}</div>` : ''}
        ${it.needsAssistance ? `<div style="font-size:11px;color:var(--danger);margin-top:2px;font-weight:600">⚠ ${it.assistanceLevel==='upper_management'?'Upper management':'Branch manager'} assistance needed</div>` : ''}

async function loadTeamStatus(branch, wk) {
  const el = document.getElementById('dash-team-list');
  if (!el) return;
  let q = db.collection('weekly_submissions').where('weekStart','==',wk);
  if (branch) q = q.where('branch','==',branch);
  const snap = await q.get();
  // Build a map of submitted emails and userIds
  const submittedEmails = new Set(snap.docs.filter(d=>d.data().status==='submitted').map(d=>d.data().userEmail));
  const submittedNames  = new Set(snap.docs.filter(d=>d.data().status==='submitted').map(d=>d.data().userName));
  const roleOrder2 = {branch_manager:0, ops_manager:1, ops_specialist:1, irrigation_supervisor:2, client_rep:3};
  const teamToShow = TEAM
    .filter(t => (!branch||t.branch===branch||branch==='ALL') && t.role!=='admin')
    .sort((a,b) => (roleOrder2[a.role]||5) - (roleOrder2[b.role]||5));
  // Load photos
  const photoMap = {};
  try {
    const uSnap = await db.collection('users').get();
    uSnap.docs.forEach(d=>{ const u=d.data(); if(u.photoURL){photoMap[u.email]=u.photoURL; photoMap[u.name]=u.photoURL;}});
  } catch(e){}
  el.innerHTML = teamToShow.map(t => {
    const done = submittedEmails.has(t.email) || submittedNames.has(t.name);
    const photo = photoMap[t.email] || photoMap[t.name];
    const avatar = photo
      ? `<img src="${photo}" style="width:30px;height:30px;border-radius:50%;object-fit:cover;flex-shrink:0;border:2px solid var(--border)">`
      : `<div class="tmr-avatar" style="background:${t.color};color:#fff">${t.initials}</div>`;
    return `<div class="team-member-row">
      ${avatar}
      <div style="flex:1">
        <div class="tmr-name">${esc(t.name)}</div>
        <div class="tmr-role">${ROLES[t.role]?.label||t.role} · ${t.branch}</div>
      </div>
      <span class="badge ${done?'success':'warn'}">${done?'✓ Done':'Pending'}</span>
    </div>`;
  }).join('');
}

function toggleSection(hdr) {

function addTableRow(btn, id) {
  const container = btn.closest('.row-table');
  if (!container) return;
  const cols = (window._rtCols && window._rtCols[id]) || [];
  if (!cols.length) { console.warn('No cols found for', id); return; }
  const rows = container.querySelectorAll('.rt-row').length;
  const newRow = document.createElement('div');
  newRow.className = 'rt-row';
  newRow.innerHTML = cols.map((c,ci) =>
    `<input type="text" id="f-${id}-r${rows}c${ci}" placeholder="${c}…" style="font-size:12px;padding:5px 7px;border:1px solid var(--border2);border-radius:4px;background:var(--surface2);color:var(--text);width:100%;font-family:inherit">`
  ).join('');
  container.insertBefore(newRow, btn);
  // Ensure grid columns inherit from parent class
  const cls = container.className.match(/rt-c\d+/)?.[0];
  if (cls) newRow.style.cssText = `display:grid;gap:8px;padding:6px 8px;border:1px solid var(--border);border-top:none;background:var(--surface);grid-template-columns:${cls==='rt-c4'?'2fr 1fr 1fr 1fr':cls==='rt-c3'?'2fr 1fr 1fr':'1fr 1fr'}`;
}

async function submitCheckin(type, existingId, status) {
  const fields = collectFormFields();
  const wk = weekKey(CW);
  const data = {
    userId: CU.uid,
    userEmail: CU.email,
    userName: CD.name,
    branch: type.includes('oc')||type==='om' ? 'OC' : type.includes('la')||type==='os'||type==='sv' ? 'LA' : CD.branch,
    role: CD.role,
    formType: type,
    weekStart: wk,
    weekEnd: weekKey(getSaturday(CW)),
    status,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    ...fields
  };
  if (!existingId) data.createdAt = firebase.firestore.FieldValue.serverTimestamp();

  try {
    if (existingId) {
      await db.collection('weekly_submissions').doc(existingId).update(data);
    } else {
      await db.collection('weekly_submissions').add(data);
    }
    toast(status==='submitted' ? '✓ Submitted successfully!' : '✓ Draft saved');
    if (status === 'submitted') navigateTo('dashboard');
  } catch(e) {
    toast('Error saving: ' + e.message, 'err');
  }
}

function collectFormFields() {
  const result = {};
  // First pass: gather all row-table fields grouped by table key and row index
  const rowData = {};
  document.querySelectorAll('#checkin-form-body [id^="f-"]').forEach(el => {
    const key = el.id.replace('f-','');
    const match = key.match(/^(.+)-r(\d+)c(\d+)$/);
    if (match) {
      const [,tableKey,rowIdx,colIdx] = match;
      if (!rowData[tableKey]) rowData[tableKey] = {};
      if (!rowData[tableKey][+rowIdx]) rowData[tableKey][+rowIdx] = {};
      rowData[tableKey][+rowIdx][+colIdx] = el.value.trim();
    } else {
      result[key] = el.value.trim();
    }
  });
  // Second pass: convert row data to flat array of objects (no nested arrays)
  // Firestore does not support nested arrays
  Object.entries(rowData).forEach(([tableKey, rows]) => {
    const flatRows = Object.values(rows)
      .map(cols => Object.values(cols).join(' | '))
      .filter(r => r.replace(/\s*\|\s*/g,'').trim());
    if (flatRows.length) result[tableKey] = flatRows; // array of strings, not arrays
  });
  return result;
}

          </select>
        </div>
        ${ta('general_notes','General notes','Any other thoughts or observations for the record…',3)}
      </div>
    </div>

    <div class="btn-row">
      <button class="btn primary" onclick="submitFridayRecap('${existingId||''}','submitted')">Submit Friday Recap</button>
      <button class="btn" onclick="submitFridayRecap('${existingId||''}','draft')">Save Draft</button>
      <button class="btn" onclick="navigateTo('dashboard')">Cancel</button>
    </div>`;
}

async function submitFridayRecap(existingId, status) {
  const fields = {};
  document.querySelectorAll('#content-area [id^="fr2-"]').forEach(el => {
    fields[el.id.replace('fr2-','')] = el.value.trim();
  });
  const data = {
    userId: CU.uid, userEmail: CU.email, userName: CD.name,
    branch: getUserBranch() || CD.branch, role: CD.role,
    formType: 'friday-recap', weekStart: weekKey(CW), weekEnd: weekKey(getSaturday(CW)),
    status, updatedAt: firebase.firestore.FieldValue.serverTimestamp(), ...fields
  };
  if (!existingId) data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
  try {
    if (existingId) {
      await db.collection('weekly_submissions').doc(existingId).update(data);
    } else {
      await db.collection('weekly_submissions').add(data);
    }
    toast(status==='submitted'?'✓ Friday recap submitted!':'✓ Draft saved');
    if (status==='submitted') navigateTo('dashboard');
  } catch(e) { toast('Error: '+e.message,'err'); }
}

async function saveManagerCarryoverUpdate(id) {
  const note = document.getElementById('mco-note').value.trim();
  const newDeadline = document.getElementById('mco-deadline').value;
  const assistanceLevel = document.getElementById('mco-assist').value;
  const colorStatus = document.getElementById('mco-color').value;
  if (!note) { toast('Please add a note','err'); return; }
  const update = {
    managerUpdate: {
      note, newDeadline, assistanceLevel, colorStatus,
      by: CD.name, role: CD.role,
      ts: new Date().toLocaleString()
    },
    colorStatus,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  };
  if (newDeadline) update.deadline = newDeadline;
  if (assistanceLevel !== 'none') { update.needsAssistance = true; update.assistanceLevel = assistanceLevel; }
  await db.collection('weekly_items').doc(id).update(update);
  document.getElementById('mgr-co-modal').remove();
  toast('✓ Manager update saved');
  renderItems();
}

// My History — individual user view
async function renderMyHistory() {
  const ca = document.getElementById('content-area');
  ca.innerHTML = '<div class="empty">Loading your history…</div>';

  // Load all my submissions — no orderBy to avoid index requirement
  const subSnap = await db.collection('weekly_submissions')
    .where('userId','==',CU.uid)
    .get();

  // Load all my items — filter by ownerName as fallback since owner field is uid
  const [itemSnap1, itemSnap2] = await Promise.all([
    db.collection('weekly_items').where('owner','==',CU.uid).get(),
    db.collection('weekly_items').where('ownerName','==',CD.name).get()
  ]);
  // Merge and deduplicate
  const seenIds = new Set();
  const allItemDocs = [...itemSnap1.docs, ...itemSnap2.docs].filter(d => {
    if (seenIds.has(d.id)) return false;
    seenIds.add(d.id); return true;
  });
  const itemSnap = { docs: allItemDocs };

  const subs = subSnap.docs.map(d=>({id:d.id,...d.data()}));
  const items = itemSnap.docs.map(d=>({id:d.id,...d.data()}));
  const completed = items.filter(i=>i.status==='completed_on_time').length;
  const late = items.filter(i=>i.status==='completed_late').length;
  const missed = items.filter(i=>i.status==='not_completed').length;
  const pending = items.filter(i=>i.status==='pending').length;
  const total = items.length;
  const rate = total ? Math.round(completed/total*100) : 0;

  ca.innerHTML = `
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px">

        {n:completed,    l:'Completed on time',    c:'var(--success)', },

      <div class="card-header">
        <div class="card-title">My Items & Status</div>
        <div style="display:flex;gap:6px">
          ${['all','pending','not_completed','completed_on_time'].map(f=>`<button class="btn sm" onclick="document.querySelectorAll('.mhi-row').forEach(r=>r.style.display=(r.dataset.status==='${f}'||'${f}'==='all'?'flex':'none'))">${f==='all'?'All':f==='pending'?'Pending':f==='not_completed'?'Carry-over':'Completed'}</button>`).join('')}
        </div>
      </div>
      ${items.length ? items.map(i=>{
        const statusColor={pending:'warn',completed_on_time:'success',completed_late:'info',not_completed:'danger'}[i.status]||'warn';
        const hasManagerUpdate = i.managerUpdate;
        return `<div class="item-row mhi-row" data-status="${i.status||'pending'}">
          <span class="priority-dot ${i.priority||'medium'}"></span>
          <div class="item-content">
            <div class="item-title">${esc(i.title)}</div>
            <div class="item-meta">Week of ${i.weekStart||'—'} · Due ${fmtDate(i.deadline)}</div>
            ${hasManagerUpdate?`<div style="margin-top:4px;font-size:11px;color:var(--info);background:var(--info-l);padding:4px 8px;border-radius:4px">
              <strong>Manager (${esc(i.managerUpdate.by)}):</strong> ${esc(i.managerUpdate.note)}
              ${i.managerUpdate.newDeadline?' · New deadline: <strong>'+fmtDate(i.managerUpdate.newDeadline)+'</strong>':''}
              <span style="color:var(--text3)"> · ${i.managerUpdate.ts}</span>

// Accountability Tracker — admin/manager only
async function renderAccountability() {
  const ca = document.getElementById('content-area');
  if (!ROLES[CD.role]?.isManager && CD.role !== 'admin') {
    ca.innerHTML='<div class="empty">Manager or Admin access required</div>'; return;
  }
  ca.innerHTML = '<div class="empty">Loading accountability data…</div>';

  const branch = getUserBranch();
  let itemQ = db.collection('weekly_items');
  if (branch) itemQ = itemQ.where('branch','==',branch);
  const itemSnap = await itemQ.get();
  const items = itemSnap.docs.map(d=>({id:d.id,...d.data()}));

  // Build per-person stats
  const stats = {};
  items.forEach(i => {
    const key = i.ownerName || 'Unknown';
    if (!stats[key]) stats[key] = { name:key, branch:i.branch||'—', total:0, onTime:0, late:0, missed:0, pending:0, carryover:0 };
    stats[key].total++;
    if (i.status==='completed_on_time') stats[key].onTime++;
    else if (i.status==='completed_late') stats[key].late++;
    else if (i.status==='not_completed') { stats[key].missed++; stats[key].carryover++; }
    else stats[key].pending++;
  });

  const people = Object.values(stats).sort((a,b)=>b.missed-a.missed);
  const overdue = items.filter(i=>i.status==='pending'&&i.deadline&&i.deadline<new Date().toISOString().split('T')[0]);
  const carryovers = items.filter(i=>i.status==='not_completed');

  const statusIcon = (p) => {
    const rate = p.total ? p.onTime/p.total : 1;
    if (rate >= 0.8) return {icon:'🟢', label:'On Track', cls:'success'};
    if (rate >= 0.5) return {icon:'🟡', label:'At Risk', cls:'warn'};
    return {icon:'🔴', label:'Needs Attention', cls:'danger'};

      <div class="card-header">
        <div class="card-title">📊 Completion Tracker — By Person</div>
        <div style="font-size:11px;color:var(--text3)">🟢 On Track ≥80% · 🟡 At Risk ≥50% · 🔴 Needs Attention</div>
      </div>
      <table style="width:100%;border-collapse:collapse;font-size:12px">
        <thead><tr>
          ${['Person','Branch','Total','✓ On Time','⚠ Late','✗ Missed','Carry-over','Rate','Status'].map(h=>`<th style="text-align:left;padding:7px 8px;border-bottom:2px solid var(--border);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text3)">${h}</th>`).join('')}
        </tr></thead>
        <tbody>${people.map(p=>{
          const rate = p.total ? Math.round(p.onTime/p.total*100) : 0;
          const st = statusIcon(p);

            <td style="padding:7px 8px;font-weight:600">${esc(p.name)}</td>
            <td style="padding:7px 8px"><span class="badge ${(p.branch||'').toLowerCase()}">${p.branch}</span></td>

function renderItemCard(it) {
  const statusColors = { pending:'warn', completed_on_time:'success', completed_late:'info', not_completed:'danger' };
  const statusLabels = { pending:'Pending', completed_on_time:'✓ On Time', completed_late:'⚠ Late', not_completed:'✗ Not Complete' };
  return `<div class="item-row" data-status="${it.status||'pending'}">
    <span class="priority-dot ${it.priority||'medium'}"></span>
    <div class="item-content">
      <div class="item-title">${esc(it.title)}</div>
      <div class="item-meta">${esc(it.ownerName||it.owner)} · Due ${fmtDate(it.deadline)}
        ${it.fridayReview?.reason?`· <em>${esc(it.fridayReview.reason)}</em>`:''}
      </div>
    </div>
    <select class="btn sm" style="cursor:pointer" onchange="updateItemStatus('${it.id}',this.value)">
      ${['pending','completed_on_time','completed_late','not_completed'].map(s=>`<option value="${s}" ${it.status===s?'selected':''}>${statusLabels[s]}</option>`).join('')}
    </select>
    ${isFriday()?`<button class="btn sm" onclick="openFridayModal('${it.id}','${esc(it.title)}')">Friday Review</button>`:''}
    ${(ROLES[CD.role]?.isManager||CD.role==='admin')&&it.carriedOver?`<button class="btn sm" style="background:var(--info-l);color:var(--info);border-color:#BFDBFE" onclick="openManagerCarryoverModal('${it.id}','${esc(it.title)}')">Manager Update</button>`:''}
  </div>
  ${it.managerUpdate?`<div style="margin-top:8px;padding:8px 10px;background:var(--info-l);border-radius:var(--r);font-size:11px;border-left:3px solid var(--info)">
    <strong>Manager update (${esc(it.managerUpdate.by||'')}):</strong> ${esc(it.managerUpdate.note||'')}
    ${it.managerUpdate.newDeadline?` · New deadline: <strong>${fmtDate(it.managerUpdate.newDeadline)}</strong>`:''}
    ${it.managerUpdate.assistanceLevel&&it.managerUpdate.assistanceLevel!=='none'?` · <span style="color:var(--danger);font-weight:600">⚠ ${it.managerUpdate.assistanceLevel==='upper_management'?'Upper mgmt':'Branch mgr'} assistance needed</span>`:''}
    <span style="color:var(--text3);margin-left:6px">${it.managerUpdate.ts||''}</span>
  </div>`:''}`;
}

function filterItems(f) {
  document.querySelectorAll('#items-list .item-row').forEach(row => {
    const show = f==='all' || row.dataset.status===f;
    row.style.display = show ? 'flex' : 'none';
  });
}

async function addItem() {
  const title = document.getElementById('ni-title').value.trim();
  const deadline = document.getElementById('ni-deadline').value;
  if (!title||!deadline) { toast('Title and deadline required','err'); return; }
  const branch = getUserBranch() || CD.branch;
  await db.collection('weekly_items').add({
    branch, weekStart: weekKey(CW), title,
    description: document.getElementById('ni-desc').value.trim(),
    deadline, priority: document.getElementById('ni-priority').value,
    owner: CU.uid, ownerName: document.getElementById('ni-owner').value||CD.name,
    status:'pending', carriedOver:false,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });
  toast('✓ Item added'); renderItems();
}

async function updateItemStatus(id, status) {
  await db.collection('weekly_items').doc(id).update({ status, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
  toast('✓ Status updated');
}

function toggleCarryoverFields() {
  const status = document.getElementById('fr-status').value;
  const fields = document.getElementById('fr-carryover-fields');
  if (fields) fields.style.display = status === 'not_completed' ? 'block' : 'none';
}

async function saveFridayReview(id) {
  const status = document.getElementById('fr-status').value;
  const newDeadline = document.getElementById('fr-deadline')?.value || '';
  if (status === 'not_completed' && !newDeadline) {
    toast('Please set a new deadline for carry-over items','err'); return;
  }
  const review = {
    status,
    reason: document.getElementById('fr-reason').value.trim(),
    newDeadline,
    assistLevel: document.getElementById('fr-assist-level')?.value || 'none',
    assistDetails: document.getElementById('fr-assist')?.value.trim() || '',
    mgrSupport: document.getElementById('fr-mgr-support')?.value.trim() || '',
    reviewedAt: new Date().toISOString(),
    reviewedBy: CD.name
  };
  const update = {
    status, fridayReview: review,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  };
  if (status === 'not_completed') {
    update.carriedOver = true;
    if (newDeadline) update.deadline = newDeadline;
    update.needsAssistance = review.assistLevel !== 'none';
    update.assistanceLevel = review.assistLevel;
  }
  await db.collection('weekly_items').doc(id).update(update);
  document.getElementById('friday-modal').remove();
  toast('✓ Friday review saved'); renderItems();
}

function setSummaryFilter(branch) {
  window._summaryBranchFilter = branch;
  renderSummary();
}

async function renderSummary() {
  const ca = document.getElementById('content-area');
  const wk = weekKey(CW);
  ca.innerHTML = '<div class="empty">Loading summary…</div>';

  // Branch managers only see their own branch; admin can filter
  const summaryBranch = CD.role === 'admin'
    ? (window._summaryBranchFilter || null)
    : getUserBranch();

  let subQ = db.collection('weekly_submissions').where('weekStart','==',wk);
  if (summaryBranch) subQ = subQ.where('branch','==',summaryBranch);
  let itemQ = db.collection('weekly_items').where('weekStart','==',wk);
  if (summaryBranch) itemQ = itemQ.where('branch','==',summaryBranch);
  let coQ = db.collection('weekly_items').where('status','==','not_completed');
  if (summaryBranch) coQ = coQ.where('branch','==',summaryBranch);

  const [subSnap, itemSnap, coSnap] = await Promise.all([subQ.get(), itemQ.get(), coQ.get()]);

  const subs = subSnap.docs.map(d=>({id:d.id,...d.data()}));
  const items = itemSnap.docs.map(d=>({id:d.id,...d.data()}));
  const carryovers = coSnap.docs.map(d=>({id:d.id,...d.data()}));

  const bmSub = subs.find(s=>s.formType==='bm'&&s.status==='submitted');
  // These are already pre-filtered by summaryBranch from the Firestore query
  // Only show OC role blocks when summaryBranch is OC or null (all)
  // Only show LA role blocks when summaryBranch is LA or null (all)
  const showOC = !summaryBranch || summaryBranch === 'OC';
  const showLA = !summaryBranch || summaryBranch === 'LA';
  const ocSubs = subs.filter(s=>s.branch==='OC'&&s.status==='submitted');
  const laSubs = subs.filter(s=>s.branch==='LA'&&s.status==='submitted');

  const renderSub = (sub) => {
    if (!sub) return '<div class="empty"><span class="empty-icon">⏳</span>Not submitted yet</div>';
    const skip = ['userId','userName','branch','role','formType','weekStart','weekEnd','status','createdAt','updatedAt','submittedAt'];
    const fields = Object.entries(sub).filter(([k])=>!skip.includes(k)&&sub[k]);
    if (!fields.length) return '<div class="empty">No data submitted</div>';
    return fields.map(([k,v]) => {
      const label = k.replace(/^[a-z]+_/,'').replace(/_/g,' ');
      if (Array.isArray(v) && v.length) {
        // Support both old nested array format and new flat string format
        const rows = v.map(r => Array.isArray(r) ? r.filter(Boolean).join(' · ') : String(r)).filter(Boolean);
        if (!rows.length) return '';
        return `<div class="sum-field">
          <div class="sum-field-label">${esc(label)}</div>
          <div>${rows.map(r=>`<div style="font-size:12px;padding:4px 0;border-bottom:1px solid var(--border)">${esc(r)}</div>`).join('')}</div>
        </div>`;
      }
      if (typeof v === 'string' && v.trim()) {
        return `<div class="sum-field">
          <div class="sum-field-label">${esc(label)}</div>
          <div class="sum-field-value">${esc(v)}</div>
        </div>`;
      }
      return '';
    }).join('');
  };

  const roleBlock = (sub, roleLabel, icon) => `
    <div class="sum-role-block">
      <div class="sum-role-hdr">
        <span style="font-size:16px">${icon}</span>
        <div class="sum-role-name">${roleLabel}</div>
        ${sub?`<span class="badge success sum-role-status">✓ Submitted</span>`:`<span class="badge warn sum-role-status">Pending</span>`}
      </div>
      <div class="sum-fields">${renderSub(sub)}</div>
    </div>`;

  ca.innerHTML = `
    <div class="summary-header">
      <div class="sum-title">Monday Meeting Summary</div>
      <div class="sum-sub">Combined operational briefing — all branches</div>
      <div class="sum-week-badge">Work Week: ${fmtWeek(CW)}</div>
    ${CD.role==='admin'?`<div style="margin-top:12px;display:flex;gap:8px">
      <button onclick="setSummaryFilter(null)" style="padding:4px 12px;border-radius:20px;font-size:11px;font-weight:600;border:none;cursor:pointer;background:${!window._summaryBranchFilter?'rgba(255,255,255,.25)':'rgba(255,255,255,.1)'};color:#fff">All</button>
      <button onclick="setSummaryFilter('OC')" style="padding:4px 12px;border-radius:20px;font-size:11px;font-weight:600;border:none;cursor:pointer;background:${window._summaryBranchFilter==='OC'?'var(--oc)':'rgba(255,255,255,.1)'};color:#fff">OC Only</button>
      <button onclick="setSummaryFilter('LA')" style="padding:4px 12px;border-radius:20px;font-size:11px;font-weight:600;border:none;cursor:pointer;background:${window._summaryBranchFilter==='LA'?'var(--la)':'rgba(255,255,255,.1)'};color:#fff">LA Only</button>
    </div>`:''}
    </div>

    ${carryovers.length ? `
    <div class="card warn-card" style="margin-bottom:16px">
      <div class="card-header"><div class="card-title">⚠ Carry-Over Items (${carryovers.length})</div></div>
      ${carryovers.map(co=>`<div class="item-row">
        <span class="priority-dot ${co.priority||'medium'}"></span>
        <div class="item-content">
          <div class="item-title">${esc(co.title)}</div>
          <div class="item-meta">${esc(co.ownerName)} · Was due ${fmtDate(co.deadline)}${co.fridayReview?.reason?' · '+esc(co.fridayReview.reason):''}</div>
        </div>
        <span class="badge danger">Carry-over</span>
      </div>`).join('')}
    </div>` : ''}

    ${bmSub ? `
    <div class="card" style="margin-bottom:16px;border-top:3px solid var(--swl-green)">
      <div class="card-header">
        <div class="card-title">📋 Branch Manager — ${esc(bmSub.userName||'')}</div>
        <span class="badge success">✓ Submitted</span>
      </div>
      <div>${renderSub(bmSub)}</div>
    </div>` : `
    <div class="card" style="margin-bottom:16px;border-top:3px solid var(--warn)">
      <div class="card-header"><div class="card-title">📋 Branch Manager Check-In</div><span class="badge warn">Pending</span></div>
    </div>`}

    ${showOC ? `<div class="sum-branch-section">
      <div class="sum-branch-hdr oc">🟠 Orange County</div>
      ${roleBlock(ocSubs.find(s=>s.formType==='om'), 'Operations Manager', '🟠')}
      ${roleBlock(ocSubs.find(s=>s.formType==='cr-oc'&&s.userName?.includes('Kim')), 'Client Rep — Kim Thrall', '🤝')}
      ${roleBlock(ocSubs.find(s=>s.formType==='cr-oc'&&s.userName?.includes('Sydney')), 'Client Rep — Sydney Smith', '🤝')}
      ${ocSubs.filter(s=>s.formType==='cr-oc'&&!s.userName?.includes('Kim')&&!s.userName?.includes('Sydney')).map(s=>roleBlock(s,'Client Rep — '+s.userName,'🤝')).join('')}
    </div>` : ''}

    ${showLA ? `<div class="sum-branch-section">
      <div class="sum-branch-hdr la">🔵 Los Angeles</div>
      ${roleBlock(laSubs.find(s=>s.formType==='os'), 'Operations Specialist — Juan Zaragoza', '🔵')}
      ${roleBlock(laSubs.find(s=>s.formType==='sv'), 'Irrigation Supervisor — Antonio Ballinas', '👷')}
      ${laSubs.filter(s=>s.formType==='cr-la').map(s=>roleBlock(s,'Client Rep — '+s.userName,'🤝')).join('')}
    </div>` : ''}

    <div class="card" style="margin-bottom:16px">
      <div class="card-header">
        <div class="card-title">📅 This Week's Items</div>
        <span class="badge neutral">${items.length} total</span>
      </div>
      ${items.length ? `
      <table class="sum-table">
        <thead><tr><th>Item</th><th>Owner</th><th>Branch</th><th>Deadline</th><th>Priority</th><th>Status</th></tr></thead>
        <tbody>${items.map(it=>`<tr>
          <td>${esc(it.title)}</td><td>${esc(it.ownerName)}</td>
          <td><span class="badge ${(it.branch||'').toLowerCase()}">${it.branch||'—'}</span></td>
          <td>${fmtDate(it.deadline)}</td>
          <td><span class="priority-dot ${it.priority}"></span> ${it.priority||'medium'}</td>
          <td><span class="badge ${it.status==='completed_on_time'?'success':it.status==='not_completed'?'danger':'warn'}">${(it.status||'pending').replace(/_/g,' ')}</span></td>
        </tr>`).join('')}</tbody>
      </table>` : '<div class="empty">No items this week</div>'}
    </div>

    <div class="btn-row" style="border:none;padding:0">
      <button class="btn primary" onclick="exportSummaryPDF()">Export PDF</button>
      <button class="btn" onclick="navigateTo('dashboard')">← Back to Dashboard</button>
    </div>`;
}

async function renderFridaySummary() {
  const ca = document.getElementById('content-area');

  ca.innerHTML = '<div class="empty">Loading Friday summary…</div>';

    .where('weekStart','==',wk)
    .where('formType','==','friday-recap');

  const snap = await q.get();
  const subs = snap.docs.map(d=>({id:d.id,...d.data()})).filter(s=>s.status==='submitted');

  // Load all items for carry-over tracking
  let itemQ = db.collection('weekly_items').where('status','==','not_completed');
  if (branch) itemQ = itemQ.where('branch','==',branch);
  const itemSnap = await itemQ.get();

  const allItemSnap = await allItemQ.get();
  const allItems = allItemSnap.docs.map(d=>({id:d.id,...d.data()}));
  const completedOnTime = allItems.filter(i=>i.status==='completed_on_time').length;
  const completedLate   = allItems.filter(i=>i.status==='completed_late').length;
  const notCompleted    = allItems.filter(i=>i.status==='not_completed').length;

  const renderSub = (sub) => {
    const skip = ['userId','userEmail','userName','branch','role','formType','weekStart','weekEnd','status','createdAt','updatedAt'];
    const fieldLabels = {
      accomplishments:'Accomplishments', client_wins:'Client Wins', team_wins:'Team Wins',
      missed_items:'Missed Items', issues_encountered:'Issues Encountered', blockers:'Blockers',
      next_week_priorities:'Next Week Priorities', carryover_notes:'Carry-Over Notes',
      support_needed:'Support Needed', week_rating:'Week Rating', general_notes:'General Notes'

    return Object.entries(sub)
      .filter(([k,v])=>!skip.includes(k)&&v&&String(v).trim())
      .map(([k,v])=>`<div class="sum-field">
        <div class="sum-field-label">${fieldLabels[k]||k.replace(/_/g,' ')}</div>
        <div class="sum-field-value">${esc(String(v))}</div>

        <button onclick="window._friSumFilter=null;renderFridaySummary()" style="padding:3px 12px;border-radius:20px;font-size:11px;font-weight:600;border:none;cursor:pointer;background:rgba(255,255,255,.25);color:#fff">All</button>
        <button onclick="window._friSumFilter='OC';renderFridaySummary()" style="padding:3px 12px;border-radius:20px;font-size:11px;font-weight:600;border:none;cursor:pointer;background:${window._friSumFilter==='OC'?'var(--oc)':'rgba(255,255,255,.1)'};color:#fff">OC</button>

      </div>`:''}
    </div>

async function renderTeam() {
  const ca = document.getElementById('content-area');
  const wk = weekKey(CW);
  const branch = getUserBranch();
  ca.innerHTML = '<div class="empty">Loading team status…</div>';

  let q = db.collection('weekly_submissions').where('weekStart','==',wk);
  if (branch) q = q.where('branch','==',branch);
  const snap = await q.get();

  // Build lookup by email → best status (submitted > draft > pending)
  const statusByEmail = {};
  const statusByName = {};
  snap.docs.forEach(d => {
    const sd = d.data();
    const email = sd.userEmail || '';
    const name  = sd.userName  || '';
    const st    = sd.status    || 'pending';
    // Keep "submitted" over "draft" over anything else
    const rank = st==='submitted'?2:st==='draft'?1:0;
    if (!statusByEmail[email] || rank > (statusByEmail[email+'_rank']||0)) {
      statusByEmail[email] = st;
      statusByEmail[email+'_rank'] = rank;
    }
    if (!statusByName[name] || rank > (statusByName[name+'_rank']||0)) {
      statusByName[name] = st;
      statusByName[name+'_rank'] = rank;
    }
  });

  // Load user photos from Firestore
  const userPhotos = {};
  const usersSnap = await db.collection('users').get();
  usersSnap.docs.forEach(d => {
    const u = d.data();
    if (u.photoURL) userPhotos[u.email] = u.photoURL;
    if (u.photoURL) userPhotos[u.name]  = u.photoURL;
  });

  // Sort: branch managers first, then ops roles, then client reps
  const roleOrder = {branch_manager:0, ops_manager:1, ops_specialist:1, irrigation_supervisor:2, client_rep:3};
  const teamToShow = TEAM
    .filter(t => t.role!=='admin' && (!branch || t.branch===branch || branch==='ALL'))
    .sort((a,b) => (roleOrder[a.role]||5) - (roleOrder[b.role]||5));

  const submitted = teamToShow.filter(t=>statusByEmail[t.email]==='submitted'||statusByName[t.name]==='submitted').length;
  const total = teamToShow.length;

  ca.innerHTML = `
    <div class="card" style="margin-bottom:16px">
      <div class="card-header">
        <div class="card-title">Team Submission Status — ${fmtWeek(CW)}</div>
        <span class="badge ${submitted===total?'success':'warn'}">${submitted}/${total} submitted</span>
      </div>
      <div style="margin-bottom:14px">
        <div class="progress-bar"><div class="progress-fill ${branch==='OC'?'oc':'la'}" style="width:${total?Math.round(submitted/total*100):0}%"></div></div>
      </div>
      ${teamToShow.map(t => {
        const status = statusByEmail[t.email] || statusByName[t.name] || 'pending';
        const photo = userPhotos[t.email] || userPhotos[t.name];
        const avatar = photo
          ? `<img src="${photo}" style="width:36px;height:36px;border-radius:50%;object-fit:cover;flex-shrink:0;border:2px solid var(--border)">`
          : `<div class="tmr-avatar" style="background:${t.color};color:#fff;width:36px;height:36px">${t.initials}</div>`;
        return `<div class="settings-row">
          ${avatar}
          <div class="sr-info">
            <div class="sr-name">${esc(t.name)}</div>
            <div class="sr-meta">${ROLES[t.role]?.label||t.role} · ${t.branch}</div>
          </div>
          <span class="badge ${status==='submitted'?'success':status==='draft'?'info':'warn'}">${status==='submitted'?'✓ Submitted':status==='draft'?'Draft':'Pending'}</span>
        </div>`;
      }).join('')}
    </div>`;
}

async function uploadUserPhoto(uid, input) {
  const file = input.files[0];
  if (!file) return;
  if (!file.type.startsWith('image/')) { toast('Please select an image file','err'); return; }
  if (file.size > 500000) { toast('Image must be under 500KB','err'); return; }
  const reader = new FileReader();
  reader.onload = async (e) => {
    const dataURL = e.target.result;
    await db.collection('users').doc(uid).update({ photoURL: dataURL });
    toast('✓ Photo uploaded');
    renderAdmin();
  };
  reader.readAsDataURL(file);
}

async function toggleUser(uid, active) {
  await db.collection('users').doc(uid).update({ active: !active });
  toast(`User ${active?'disabled':'enabled'}`); renderAdmin();
}

async function createUserProfile() {
  const uid      = document.getElementById('nu-uid').value.trim();
  const name     = document.getElementById('nu-name').value.trim();
  const email    = document.getElementById('nu-email').value.trim();
  const role     = document.getElementById('nu-role').value;
  const branch   = document.getElementById('nu-branch').value;
  const formType = document.getElementById('nu-formtype').value;
  const result   = document.getElementById('nu-result');

  if (!uid)    { toast('Firebase UID is required','err'); return; }
  if (!name)   { toast('Full name is required','err'); return; }
  if (!email)  { toast('Email is required','err'); return; }
  if (!role)   { toast('Role is required','err'); return; }
  if (!branch) { toast('Branch is required','err'); return; }

  // Determine the correct formType if not manually set
  const autoFormType = formType || (
    role === 'branch_manager'        ? 'bm'    :
    role === 'ops_manager'           ? 'om'    :
    role === 'ops_specialist'        ? 'os'    :
    role === 'irrigation_supervisor' ? 'sv'    :
    role === 'client_rep' || role === 'client_rep_2' ? (branch==='LA'?'cr-la':'cr-oc') : 'cr-oc'
  );

  const actualRole = role === 'client_rep_2' ? 'client_rep' : role;

  try {
    await db.collection('users').doc(uid).set({
      name, email,
      role: actualRole,
      branch,
      formType: autoFormType,
      active: true,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    // Show success inline
    if (result) {
      result.style.display = 'block';
      result.innerHTML = `<div style="background:var(--success-l);border:1px solid #A7F3D0;border-radius:var(--r);padding:10px 14px;font-size:13px;color:var(--success)">
        <strong>✓ Profile created for ${esc(name)}</strong><br>
        <span style="font-size:11px;color:var(--text2)">Role: ${ROLES[actualRole]?.label||actualRole} · Branch: ${branch} · Form: ${autoFormType}</span><br>
        <span style="font-size:11px;color:var(--text3)">They can now log in with their Firebase Auth email and password.</span>
      </div>`;
    }

    toast('✓ User profile created for ' + name);

    // Clear form
    ['nu-uid','nu-name','nu-email'].forEach(id => document.getElementById(id).value = '');

    // Refresh user list
    setTimeout(() => renderAdmin(), 800);

  } catch(e) {
    toast('Error: ' + e.message, 'err');
    if (result) {
      result.style.display = 'block';
      result.innerHTML = `<div style="background:var(--danger-l);border:1px solid #FECACA;border-radius:var(--r);padding:10px 14px;font-size:13px;color:var(--danger)">Error: ${esc(e.message)}</div>`;
    }
  }
}

async function updateUserProfile() {
  const uid    = document.getElementById('nu-uid').value.trim();
  const name   = document.getElementById('nu-name').value.trim();
  const email  = document.getElementById('nu-email').value.trim();
  const role   = document.getElementById('nu-role').value;
  const branch = document.getElementById('nu-branch').value;
  const formType = document.getElementById('nu-formtype').value;
  const result = document.getElementById('nu-result');

  if (!uid) { toast('Firebase UID is required to update','err'); return; }

  const updates = {};
  if (name)   updates.name   = name;
  if (email)  updates.email  = email;
  if (role)   updates.role   = role === 'client_rep_2' ? 'client_rep' : role;
  if (branch) updates.branch = branch;
  if (formType) updates.formType = formType;

  try {
    await db.collection('users').doc(uid).update(updates);
    toast('✓ Profile updated');
    if (result) {
      result.style.display = 'block';
      result.innerHTML = `<div style="background:var(--success-l);border:1px solid #A7F3D0;border-radius:var(--r);padding:10px 14px;font-size:13px;color:var(--success)">✓ Profile updated successfully.</div>`;
    }
    setTimeout(() => renderAdmin(), 800);
  } catch(e) {
    toast('Error: ' + e.message, 'err');
  }
}
