<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>SWL Operations Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
/* ═══════════════════════════════════════
   DESIGN TOKENS
═══════════════════════════════════════ */
:root {
  /* Brand */
  --burg:#7A1C2E; --burg2:#5E1522;
  --swl-green:#0E4C2D; --swl-green2:#0A3A22;
  --sage:#D3DED7;
  /* OC — Ducks */
  --oc:#FC4C02; --oc2:#C93D00; --oc-l:#FFF0E8; --oc-l2:#FFD5BA;
  /* LA — Dodgers */
  --la:#005A9C; --la2:#003F6E; --la-l:#E8F2FB; --la-l2:#BFDBF7;
  /* UI */
  --bg:#F1F3F4; --surface:#FFFFFF; --surface2:#F8F9FA; --surface3:#F0F2F0;
  --border:#E2E8E4; --border2:#C8D4CE;
  --text:#0D1B12; --text2:#3A4F43; --text3:#7A9088; --text4:#B0C4BB;
  --success:#059669; --success-l:#ECFDF5;
  --warn:#D97706; --warn-l:#FFFBEB;
  --danger:#DC2626; --danger-l:#FEF2F2;
  --info:#2563EB; --info-l:#EFF6FF;
  --critical:#7C3AED; --critical-l:#F5F3FF;
  /* Sidebar */
  --sb-bg:#0D1B12; --sb-border:rgba(255,255,255,.07);
  --sb-text:rgba(211,222,215,.7); --sb-active:#fff;
  /* Layout */
  --sb-w:220px;
  --r:6px; --rl:10px; --rxl:14px;
  --sh:0 1px 2px rgba(0,0,0,.06),0 1px 3px rgba(0,0,0,.04);
  --shm:0 4px 16px rgba(0,0,0,.10),0 1px 4px rgba(0,0,0,.06);
}

/* ═══════════════════════════════════════
   RESET + BASE
═══════════════════════════════════════ */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',system-ui,sans-serif;font-size:13px;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}

/* ═══════════════════════════════════════
   APP LAYOUT
═══════════════════════════════════════ */
/* login-wrap handled by scene CSS below */

.app{display:flex;height:100vh;overflow:hidden}
.sidebar{
  width:var(--sb-w);flex-shrink:0;background:var(--sb-bg);
  display:flex;flex-direction:column;height:100vh;overflow:hidden;
  border-right:1px solid var(--sb-border);
}
.main-area{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.top-bar{
  height:52px;flex-shrink:0;background:var(--surface);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 20px;gap:12px;
}
.content-area{flex:1;overflow-y:auto;overflow-x:hidden;padding:20px}

/* ═══════════════════════════════════════
   LOGIN
═══════════════════════════════════════ */
.login-card{
  background:#fff;border-radius:16px;padding:36px;width:420px;
  box-shadow:0 24px 64px rgba(0,0,0,.25);position:relative;overflow:hidden;
}
.login-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--burg),var(--oc))}
.login-brand-name{font-size:20px;font-weight:700;color:var(--burg);letter-spacing:-.3px}
.login-brand-sub{font-size:12px;font-weight:600;color:var(--swl-green);margin-top:1px}
.login-tagline{font-size:12px;color:var(--text3);margin:12px 0 24px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.login-card h2{font-size:15px;font-weight:600;color:var(--text);margin-bottom:16px}
.lf{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.lf label{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.06em}
.lf input{font-size:13px;padding:10px 12px;border:1.5px solid var(--border2);border-radius:var(--r);font-family:inherit;color:var(--text);outline:none;transition:border-color .15s}
.lf input:focus{border-color:var(--swl-green);box-shadow:0 0 0 3px rgba(14,76,45,.08)}
#l-btn{width:100%;padding:11px;font-size:13px;font-weight:600;background:var(--swl-green);color:#fff;border:none;border-radius:var(--r);cursor:pointer;font-family:inherit;transition:background .15s;margin-top:4px}
#l-btn:hover{background:var(--swl-green2)}
#l-btn:disabled{opacity:.6;cursor:not-allowed}
#l-err{margin-top:12px;padding:10px 12px;background:var(--danger-l);border:1px solid #FECACA;border-radius:var(--r);color:var(--danger);font-size:12px;font-weight:500;display:none}
#l-err.show{display:block}

/* ═══════════════════════════════════════
   SIDEBAR
═══════════════════════════════════════ */
.sb-header{padding:16px;border-bottom:1px solid var(--sb-border)}
.sb-logo{font-size:13px;font-weight:700;color:#fff;line-height:1.3}
.sb-logo-sub{font-size:10px;color:var(--sb-text);margin-top:1px}
.sb-user{padding:12px 16px;border-bottom:1px solid var(--sb-border)}
.sb-user-name{font-size:12px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-user-role{font-size:11px;color:var(--sb-text);margin-top:2px}
.sb-branch-tag{display:inline-flex;align-items:center;margin-top:6px;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.sb-branch-tag.oc{background:var(--oc);color:#fff}
.sb-branch-tag.la{background:var(--la);color:#fff}
.sb-branch-tag.all{background:var(--burg);color:#fff}
.sb-nav{flex:1;overflow-y:auto;padding:8px 0}
.sb-section-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--sb-text);padding:12px 16px 4px;opacity:.5}
.nav-btn{
  display:flex;align-items:center;gap:9px;width:100%;padding:8px 16px;
  font-size:12px;font-weight:500;color:var(--sb-text);background:none;border:none;
  cursor:pointer;font-family:inherit;text-align:left;transition:all .12s;border-radius:0;
  position:relative;
}
.nav-btn:hover{color:#fff;background:rgba(255,255,255,.06)}
.nav-btn.active{color:#fff;background:rgba(255,255,255,.1)}
.nav-btn.active::before{content:'';position:absolute;left:0;top:4px;bottom:4px;width:3px;background:var(--oc);border-radius:0 2px 2px 0}
.nav-btn.active.la-nav::before{background:var(--la)}
.nav-btn svg{width:14px;height:14px;flex-shrink:0;opacity:.6}
.nav-btn.active svg,.nav-btn:hover svg{opacity:1}
.sb-footer{padding:12px 16px;border-top:1px solid var(--sb-border)}
.sb-week{font-size:10px;color:var(--sb-text);margin-bottom:8px;opacity:.7}
.sb-week-val{font-size:11px;color:#fff;font-weight:500}
.week-nav-btns{display:flex;gap:4px;margin-top:4px}
.week-nav-btns button{flex:1;padding:4px;font-size:11px;background:rgba(255,255,255,.08);color:var(--sb-text);border:none;border-radius:4px;cursor:pointer;font-family:inherit}
.week-nav-btns button:hover{background:rgba(255,255,255,.14);color:#fff}
.signout-btn{display:flex;align-items:center;gap:6px;width:100%;padding:6px 0;font-size:11px;color:var(--sb-text);background:none;border:none;cursor:pointer;font-family:inherit;margin-top:10px}
.signout-btn:hover{color:#fff}

/* ═══════════════════════════════════════
   TOP BAR
═══════════════════════════════════════ */
.tb-title{font-size:14px;font-weight:600;color:var(--text);flex:1}
.tb-week{font-size:12px;color:var(--text3);background:var(--surface2);padding:4px 10px;border-radius:20px;border:1px solid var(--border)}
.tb-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px}

/* ═══════════════════════════════════════
   SCREENS
═══════════════════════════════════════ */
.screen{display:none}
.screen.active{display:block}

/* ═══════════════════════════════════════
   DASHBOARD
═══════════════════════════════════════ */
.dash-greeting{font-size:22px;font-weight:700;color:var(--text);letter-spacing:-.4px;margin-bottom:2px}
.dash-sub{font-size:13px;color:var(--text3);margin-bottom:20px}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:16px;box-shadow:var(--sh);position:relative;overflow:hidden}
.stat-card::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px}
.stat-card.oc-stat::after{background:var(--oc)}
.stat-card.la-stat::after{background:var(--la)}
.stat-card.warn-stat::after{background:var(--warn)}
.stat-card.ok-stat::after{background:var(--success)}
.stat-num{font-size:28px;font-weight:700;letter-spacing:-1px;line-height:1;color:var(--text)}
.stat-lbl{font-size:11px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-top:4px}
.cards-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:18px;box-shadow:var(--sh)}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.card-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text3)}
.card.oc-card{border-top:3px solid var(--oc)}
.card.la-card{border-top:3px solid var(--la)}
.card.warn-card{border-top:3px solid var(--warn)}
.card.full{grid-column:1/-1}

/* ═══════════════════════════════════════
   PROGRESS BAR
═══════════════════════════════════════ */
.progress-wrap{margin-bottom:16px}
.progress-label{display:flex;justify-content:space-between;font-size:11px;color:var(--text3);margin-bottom:4px}
.progress-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;border-radius:3px;transition:width .4s cubic-bezier(.4,0,.2,1)}
.progress-fill.oc{background:var(--oc)}
.progress-fill.la{background:var(--la)}
.progress-fill.green{background:var(--success)}

/* ═══════════════════════════════════════
   BADGES + STATUS
═══════════════════════════════════════ */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
.badge.success{background:var(--success-l);color:var(--success);border:1px solid #A7F3D0}
.badge.warn{background:var(--warn-l);color:var(--warn);border:1px solid #FDE68A}
.badge.danger{background:var(--danger-l);color:var(--danger);border:1px solid #FECACA}
.badge.info{background:var(--info-l);color:var(--info);border:1px solid #BFDBFE}
.badge.critical{background:var(--critical-l);color:var(--critical);border:1px solid #DDD6FE}
.badge.oc{background:var(--oc-l);color:var(--oc2);border:1px solid var(--oc-l2)}
.badge.la{background:var(--la-l);color:var(--la2);border:1px solid var(--la-l2)}
.badge.neutral{background:var(--surface2);color:var(--text2);border:1px solid var(--border)}
.priority-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;display:inline-block}
.priority-dot.low{background:var(--success)}
.priority-dot.medium{background:var(--warn)}
.priority-dot.high{background:var(--danger)}
.priority-dot.critical{background:var(--critical)}

/* ═══════════════════════════════════════
   FORMS
═══════════════════════════════════════ */
.form-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);margin-bottom:12px;overflow:hidden;box-shadow:var(--sh)}
.form-section-hdr{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;cursor:pointer;user-select:none;
  border-bottom:1px solid transparent;transition:background .12s;
}
.form-section-hdr:hover{background:var(--surface2)}
.form-section-hdr.open{border-bottom-color:var(--border)}
.fsh-left{display:flex;align-items:center;gap:10px}
.fsh-icon{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.fsh-title{font-size:12px;font-weight:600;color:var(--text)}
.fsh-sub{font-size:11px;color:var(--text3);margin-top:1px}
.fsh-chevron{color:var(--text3);transition:transform .2s;font-size:12px}
.fsh-chevron.open{transform:rotate(180deg)}
.form-section-body{padding:16px;display:none}
.form-section-body.open{display:block}
.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.fg label{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:6px}
.fg input,.fg select,.fg textarea{font-size:13px;padding:8px 11px;border:1.5px solid var(--border2);border-radius:var(--r);background:var(--surface);color:var(--text);font-family:inherit;width:100%;transition:border-color .15s;outline:none}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--swl-green);box-shadow:0 0 0 3px rgba(14,76,45,.06)}
.fg textarea{resize:vertical;min-height:72px;line-height:1.6}
.fg .hint{font-size:11px;color:var(--text3)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px}
.req{color:var(--danger);margin-left:2px}

/* ═══════════════════════════════════════
   ROW TABLE (property/project entries)
═══════════════════════════════════════ */
.row-table{margin-top:10px}
.rt-header{display:grid;gap:8px;padding:5px 8px;background:var(--surface2);border-radius:4px 4px 0 0;border:1px solid var(--border)}
.rt-row{display:grid;gap:8px;padding:6px 8px;border:1px solid var(--border);border-top:none;background:var(--surface)}
.rt-row:last-child{border-radius:0 0 4px 4px}
.rt-header span{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text3)}
.rt-row input{font-size:12px;padding:5px 7px;border:1px solid var(--border2);border-radius:4px;background:var(--surface2);color:var(--text);font-family:inherit;width:100%;outline:none}
.rt-row input:focus{border-color:var(--swl-green);background:var(--surface)}
.rt-c3 .rt-header,.rt-c3 .rt-row{grid-template-columns:2fr 1fr 1fr}
.rt-c4 .rt-header,.rt-c4 .rt-row{grid-template-columns:2fr 1fr 1fr 1fr}
.add-row-btn{font-size:11px;color:var(--text3);background:none;border:1px dashed var(--border2);border-top:none;padding:5px;width:100%;cursor:pointer;font-family:inherit;border-radius:0 0 4px 4px;transition:all .12s}
.add-row-btn:hover{background:var(--surface2);color:var(--text2)}

/* ═══════════════════════════════════════
   BUTTONS
═══════════════════════════════════════ */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;font-size:12px;font-weight:600;border:1px solid var(--border2);border-radius:var(--r);background:var(--surface);color:var(--text);cursor:pointer;font-family:inherit;transition:all .12s;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--swl-green);color:#fff;border-color:var(--swl-green)}
.btn.primary:hover{background:var(--swl-green2)}
.btn.oc-btn{background:var(--oc);color:#fff;border-color:var(--oc)}
.btn.oc-btn:hover{background:var(--oc2)}
.btn.la-btn{background:var(--la);color:#fff;border-color:var(--la)}
.btn.la-btn:hover{background:var(--la2)}
.btn.danger{background:var(--danger-l);color:var(--danger);border-color:#FECACA}
.btn.sm{padding:5px 10px;font-size:11px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;padding-top:16px;border-top:1px solid var(--border)}

/* ═══════════════════════════════════════
   MONDAY SUMMARY
═══════════════════════════════════════ */
.summary-header{background:var(--swl-green);border-radius:var(--rxl);padding:20px 24px;margin-bottom:20px;color:#fff;position:relative;overflow:hidden}
.summary-header::before{content:'';position:absolute;right:-20px;top:-30px;width:200px;height:200px;background:rgba(255,255,255,.03);border-radius:50%}
.sum-title{font-size:20px;font-weight:700;letter-spacing:-.3px;margin-bottom:3px}
.sum-sub{font-size:12px;opacity:.7}
.sum-week-badge{display:inline-block;background:rgba(255,255,255,.12);padding:4px 12px;border-radius:20px;font-size:11px;font-weight:600;margin-top:8px}
.sum-branch-section{margin-bottom:24px}
.sum-branch-hdr{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding:10px 14px;border-radius:var(--r);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.sum-branch-hdr.oc{background:var(--oc-l);color:var(--oc2);border-left:4px solid var(--oc)}
.sum-branch-hdr.la{background:var(--la-l);color:var(--la2);border-left:4px solid var(--la)}
.sum-role-block{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);margin-bottom:10px;overflow:hidden;box-shadow:var(--sh)}
.sum-role-hdr{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--surface2)}
.sum-role-name{font-size:12px;font-weight:700;color:var(--text)}
.sum-role-status{margin-left:auto}
.sum-fields{padding:12px 14px}
.sum-field{margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.sum-field:last-child{border:none;margin-bottom:0;padding-bottom:0}
.sum-field-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-bottom:4px}
.sum-field-value{font-size:13px;color:var(--text);line-height:1.6;white-space:pre-wrap}
.sum-field-value.empty{color:var(--text4);font-style:italic}
.sum-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
.sum-table th{text-align:left;padding:5px 8px;background:var(--surface2);border-bottom:2px solid var(--border);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text3)}
.sum-table td{padding:5px 8px;border-bottom:1px solid var(--border);vertical-align:top}

/* ═══════════════════════════════════════
   ITEMS / CARRYOVER
═══════════════════════════════════════ */
.item-row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.item-row:last-child{border:none;padding-bottom:0}
.item-content{flex:1;min-width:0}
.item-title{font-size:13px;font-weight:500;color:var(--text);margin-bottom:2px}
.item-meta{font-size:11px;color:var(--text3)}
.team-member-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.team-member-row:last-child{border:none}
.tmr-avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.tmr-name{font-size:12px;font-weight:600;color:var(--text);flex:1}
.tmr-role{font-size:11px;color:var(--text3)}

/* ═══════════════════════════════════════
   ADMIN / SETTINGS
═══════════════════════════════════════ */
.settings-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.settings-row:last-child{border:none}
.sr-info{flex:1}
.sr-name{font-size:13px;font-weight:600;color:var(--text)}
.sr-meta{font-size:11px;color:var(--text3);margin-top:1px}
.sr-actions{display:flex;align-items:center;gap:6px}

/* ═══════════════════════════════════════
   TOAST
═══════════════════════════════════════ */
#toast{
  position:fixed;bottom:20px;right:20px;
  padding:10px 16px;border-radius:var(--rl);font-size:12px;font-weight:600;color:#fff;
  background:var(--swl-green);box-shadow:var(--shm);
  transform:translateY(80px);opacity:0;transition:all .25s cubic-bezier(.4,0,.2,1);z-index:2000;
}
#toast.show{transform:translateY(0);opacity:1}
#toast.err{background:var(--danger)}
#toast.warn{background:var(--warn)}

/* ═══════════════════════════════════════
   EMPTY STATE
═══════════════════════════════════════ */
.empty{text-align:center;padding:32px 20px;color:var(--text3);font-size:13px}
.empty-icon{font-size:28px;display:block;margin-bottom:8px;opacity:.4}

/* ═══════════════════════════════════════
   RESPONSIVE
═══════════════════════════════════════ */
@media(max-width:900px){
  .sidebar{display:none}
  .stats-grid{grid-template-columns:1fr 1fr}
  .cards-row{grid-template-columns:1fr}
  .g2,.g3,.g4{grid-template-columns:1fr}
}
@media(max-width:600px){
  .stats-grid{grid-template-columns:1fr}
  .content-area{padding:12px}
}

/* ════ TIME-OF-DAY SCENE ════ */
#login-wrap { position:fixed;inset:0;overflow:hidden;background:#0E4C2D; }
#login-wrap.hidden { display:none; }
.ls-scene {
  position:absolute;inset:0;
  transition:background 3s ease, filter 3s ease;
}
.ls-scene.dawn      { background:linear-gradient(180deg,#12103a 0%,#3d1f5a 12%,#8a3455 24%,#c45c30 34%,#e8904a 44%,#f0c060 54%,#8ac5e8 68%,#b8dcf0 82%,#cce8aa 92%,#4a8030 100%) !important; }
.ls-scene.morning   { background:linear-gradient(180deg,#4888c0 0%,#72b4e4 22%,#a4d4f4 44%,#c4e8f4 62%,#d4eec8 78%,#a4d468 90%,#5a9828 100%); }
.ls-scene.midday    { background:linear-gradient(180deg,#1868bc 0%,#3888d8 20%,#68b4ec 42%,#a4d8f8 58%,#cceec0 74%,#88c448 88%,#4a8822 100%); }
.ls-scene.afternoon { background:linear-gradient(180deg,#2868a8 0%,#488cc8 22%,#78b6e8 44%,#b4d6ee 62%,#d4e8b8 78%,#8abc48 90%,#4a8822 100%); }
.ls-scene.sunset    { background:linear-gradient(180deg,#181848 0%,#382070 14%,#882854 26%,#c44820 36%,#e87830 46%,#f0a84c 56%,#e8c880 66%,#c8a050 76%,#886030 86%,#384808 96%,#1a2808 100%); }
.ls-scene.dusk      { background:linear-gradient(180deg,#080820 0%,#181038 14%,#381848 28%,#603830 42%,#8a5828 54%,#a07030 64%,#786030 74%,#404018 84%,#202808 94%,#101408 100%); }
.ls-scene.night     { background:linear-gradient(180deg,#020208 0%,#04040e 18%,#060a1c 36%,#0a1228 52%,#0e1a2c 66%,#142414 78%,#0a180a 90%,#060e06 100%); }

/* brightness shift */
.ls-scene.dawn      { filter:brightness(.85); }
.ls-scene.morning   { filter:brightness(1); }
.ls-scene.midday    { filter:brightness(1.05); }
.ls-scene.afternoon { filter:brightness(.98); }
.ls-scene.sunset    { filter:brightness(.88); }
.ls-scene.dusk      { filter:brightness(.55); }
.ls-scene.night     { filter:brightness(.4); }

/* ── CELESTIAL ── */
.ls-sun {
  position:absolute;border-radius:50%;
  left:50%;transform:translateX(-50%);
  transition:bottom 3s ease, width 3s ease, height 3s ease, box-shadow 3s ease, opacity 3s ease;
}
.ls-scene.dawn     .ls-sun { bottom:32%;width:68px;height:68px;background:radial-gradient(circle,#fff9c0 0%,#ffd54f 35%,#ffb300 65%,transparent 100%);box-shadow:0 0 60px 28px rgba(255,200,50,.4),0 0 120px 60px rgba(255,150,0,.15); }
.ls-scene.morning  .ls-sun { bottom:52%;width:72px;height:72px;background:radial-gradient(circle,#fffde0 0%,#ffe082 40%,#ffc107 70%,transparent 100%);box-shadow:0 0 70px 32px rgba(255,220,80,.45); }
.ls-scene.midday   .ls-sun { bottom:70%;width:80px;height:80px;background:radial-gradient(circle,#ffffff 0%,#fff9c0 30%,#ffd740 65%,transparent 100%);box-shadow:0 0 80px 40px rgba(255,240,120,.5); }
.ls-scene.afternoon .ls-sun { bottom:58%;width:76px;height:76px;background:radial-gradient(circle,#fffde0 0%,#ffe082 35%,#ffb300 65%,transparent 100%);box-shadow:0 0 70px 34px rgba(255,200,60,.4); }
.ls-scene.sunset   .ls-sun { bottom:22%;width:88px;height:88px;background:radial-gradient(circle,#fff0a0 0%,#ff9800 40%,#f44336 70%,transparent 100%);box-shadow:0 0 80px 40px rgba(255,100,30,.5),0 0 160px 80px rgba(255,60,0,.18); }
.ls-scene.dusk     .ls-sun { bottom:4%;width:70px;height:70px;background:radial-gradient(circle,#ff8a50 0%,#e64a19 50%,transparent 100%);box-shadow:0 0 50px 24px rgba(255,80,20,.35);opacity:.7; }
.ls-scene.night    .ls-sun { opacity:0; }
.ls-moon { position:absolute;border-radius:50%;left:30%;transition:bottom 3s ease, opacity 3s ease;opacity:0; }
.ls-scene.night .ls-moon { bottom:60%;width:46px;height:46px;background:radial-gradient(circle,#f5f5e0 0%,#ddd8b8 55%,#b8b4a0 100%);box-shadow:0 0 30px 12px rgba(200,200,170,.25);opacity:1; }
.ls-scene.dusk  .ls-moon { bottom:40%;opacity:.3;width:38px;height:38px;background:radial-gradient(circle,#e8e8d0 0%,#c8c4a8 100%); }

/* ── STARS ── */
.ls-stars { position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 3s ease; }
.ls-scene.night .ls-stars { opacity:1; }
.ls-scene.dusk  .ls-stars { opacity:.25; }
.ls-star { position:absolute;border-radius:50%;background:#fff;animation:twinkle ease-in-out infinite; }
@keyframes twinkle { 0%,100%{opacity:.15;transform:scale(1)}50%{opacity:1;transform:scale(1.5)} }

/* ── AURORA ── */
.ls-aurora { position:absolute;top:0;left:0;right:0;height:45%;opacity:0;transition:opacity 3s ease;pointer-events:none;
  background:linear-gradient(180deg,transparent 0%,rgba(30,180,100,.07) 35%,rgba(80,120,200,.05) 65%,transparent 100%);
  animation:auroraPulse 9s ease-in-out infinite; }
.ls-scene.night .ls-aurora { opacity:1; }
@keyframes auroraPulse { 0%,100%{opacity:.25;transform:scaleX(1)}50%{opacity:.9;transform:scaleX(1.06)} }

/* ── CLOUDS ── */
.ls-clouds { position:absolute;top:6%;left:0;right:0;pointer-events:none;transition:opacity 3s ease; }
.ls-scene.night .ls-clouds { opacity:.08; }
.ls-scene.dusk  .ls-clouds { opacity:.35; }
.ls-cloud { position:absolute;border-radius:50px;animation:cDrift linear infinite;
  transition:background 3s ease; }
.ls-cloud::before,.ls-cloud::after { content:'';position:absolute;background:inherit;border-radius:50%; }
.ls-scene.dawn     .ls-cloud { background:rgba(255,190,160,.55); }
.ls-scene.morning  .ls-cloud { background:rgba(255,255,255,.85); }
.ls-scene.midday   .ls-cloud { background:rgba(255,255,255,.92); }
.ls-scene.afternoon .ls-cloud { background:rgba(255,255,255,.85); }
.ls-scene.sunset   .ls-cloud { background:rgba(255,130,80,.5); }
.ls-scene.dusk     .ls-cloud { background:rgba(170,90,110,.45); }
.ls-c1{width:130px;height:36px;top:10px;left:-160px;animation-duration:44s}
.ls-c1::before{width:62px;height:55px;top:-26px;left:16px}
.ls-c1::after{width:48px;height:46px;top:-20px;left:52px}
.ls-c2{width:96px;height:28px;top:52px;left:-120px;animation-duration:58s;animation-delay:8s;opacity:.7}
.ls-c2::before{width:48px;height:42px;top:-18px;left:12px}
.ls-c2::after{width:36px;height:34px;top:-14px;left:40px}
.ls-c3{width:148px;height:40px;top:18px;right:-180px;animation-duration:50s;animation-delay:3s}
.ls-c3::before{width:72px;height:62px;top:-28px;left:22px}
.ls-c3::after{width:52px;height:50px;top:-22px;left:64px}
.ls-c4{width:78px;height:22px;top:82px;left:-100px;animation-duration:68s;animation-delay:18s;opacity:.65}
.ls-c4::before{width:38px;height:34px;top:-14px;left:10px}
.ls-c4::after{width:28px;height:26px;top:-10px;left:30px}
@keyframes cDrift { 0%{transform:translateX(0)}100%{transform:translateX(130vw)} }

/* ── HILLS ── */
.ls-hills { position:absolute;bottom:22%;left:0;right:0;height:200px;pointer-events:none;transition:filter 3s ease; }
.ls-scene.dawn     .ls-hills { filter:brightness(.5) saturate(.8); }
.ls-scene.night    .ls-hills { filter:brightness(.1) saturate(.3); }
.ls-scene.dusk     .ls-hills { filter:brightness(.32) saturate(.8); }
.ls-hill { position:absolute;bottom:0;border-radius:50% 55% 0 0; }
.ls-hf1{width:60%;height:158px;left:-12%;background:#2a5818}
.ls-hf2{width:55%;height:138px;right:-10%;background:#225014}
.ls-hm1{width:42%;height:118px;left:5%;background:#387022}
.ls-hm2{width:40%;height:106px;right:3%;background:#306818}
.ls-hc {width:68%;height:92px;left:16%;background:#488828}

/* ── GROUND ── */
.ls-ground { position:absolute;bottom:0;left:0;right:0;height:23%;transition:filter 3s ease; }
.ls-ground-base { position:absolute;inset:0;background:linear-gradient(180deg,#488828 0%,#2c5816 45%,#183808 100%); }
.ls-ground-top  { position:absolute;top:0;left:0;right:0;height:10px;
  background:repeating-linear-gradient(90deg,#58a830 0,#489028 10px,#387820 20px,#58a830 30px);opacity:.7; }
.ls-scene.dawn  .ls-ground { filter:brightness(.48); }
.ls-scene.night .ls-ground { filter:brightness(.09); }
.ls-scene.dusk  .ls-ground { filter:brightness(.3); }

/* ── GRASS ── */
.ls-grass-field { position:absolute;bottom:22.5%;left:0;right:0;height:72px;
  display:flex;align-items:flex-end;overflow:visible;transition:filter 3s ease; }
.ls-scene.dawn  .ls-grass-field { filter:brightness(.44); }
.ls-scene.night .ls-grass-field { filter:brightness(.08); }
.ls-scene.dusk  .ls-grass-field { filter:brightness(.28); }
.ls-blade { flex-shrink:0;transform-origin:bottom center;border-radius:2px 2px 0 0;
  animation:bladeWave ease-in-out infinite; }
@keyframes bladeWave {
  0%,100%{transform:rotate(var(--lean,0deg)) skewX(-1deg)}
  35%{transform:rotate(calc(var(--lean,0deg) + 5deg)) skewX(1.5deg)}
  68%{transform:rotate(calc(var(--lean,0deg) - 4deg)) skewX(-1deg)}
}

/* ── FLOWERS ── */
.ls-flowers-layer { position:absolute;bottom:22%;left:0;right:0;height:65px;
  pointer-events:none;transition:filter 3s ease; }
.ls-scene.dawn  .ls-flowers-layer { filter:brightness(.38); }
.ls-scene.night .ls-flowers-layer { filter:brightness(.05); }
.ls-scene.dusk  .ls-flowers-layer { filter:brightness(.24); }
.ls-flower { position:absolute;bottom:0;transform-origin:bottom center;
  animation:flowerGrow 9s cubic-bezier(.34,1.3,.64,1) both; }
@keyframes flowerGrow {
  0%{transform:scaleY(0);opacity:0}40%{opacity:1}80%{transform:scaleY(1.04)}100%{transform:scaleY(1);opacity:1}
}
.ls-petal { position:absolute;border-radius:50%;animation:petalOpen 3s cubic-bezier(.34,1.2,.64,1) both; }
@keyframes petalOpen {
  0%{transform:rotate(var(--pr,0deg)) scale(0);opacity:0}
  55%{opacity:1}80%{transform:rotate(var(--pr,0deg)) scale(1.1)}
  100%{transform:rotate(var(--pr,0deg)) scale(1);opacity:1}
}

/* ── CSS TREES (drawn entirely in CSS/JS canvas — no SVG blobs) ── */
.ls-tree-zone { position:absolute;bottom:22%;left:0;right:0;height:420px;
  pointer-events:none;transition:filter 3s ease; }
.ls-scene.dawn  .ls-tree-zone { filter:brightness(.48) saturate(.75); }
.ls-scene.night .ls-tree-zone { filter:brightness(.09) saturate(.25); }
.ls-scene.dusk  .ls-tree-zone { filter:brightness(.32) saturate(.82); }
.ls-bush-zone { position:absolute;bottom:22%;left:0;right:0;height:80px;
  pointer-events:none;transition:filter 3s ease;z-index:2; }
.ls-scene.dawn  .ls-bush-zone { filter:brightness(.44); }
.ls-scene.night .ls-bush-zone { filter:brightness(.08); }
.ls-scene.dusk  .ls-bush-zone { filter:brightness(.28); }

/* ── BIRDS ── */
.ls-birds { position:absolute;top:14%;pointer-events:none; }
.ls-bird { position:absolute;width:18px;height:8px;opacity:0;animation:bFly linear infinite; }
.ls-bird::before,.ls-bird::after { content:'';position:absolute;border-top:2.5px solid rgba(20,20,45,.55);
  width:10px;height:5px;border-radius:50% 50% 0 0; }
.ls-bird::before{left:0;transform-origin:right bottom;animation:wingFlap .45s ease-in-out infinite alternate}
.ls-bird::after{right:0;transform-origin:left bottom;animation:wingFlap .45s ease-in-out infinite alternate reverse}
@keyframes wingFlap{0%{transform:rotate(-22deg)}100%{transform:rotate(16deg)}}
.ls-scene.night .ls-birds{opacity:0}
.ls-b1{animation-duration:22s;animation-delay:3s;top:0;left:0}
.ls-b2{animation-duration:30s;animation-delay:8s;top:28px;left:40px;transform:scale(.7)}
.ls-b3{animation-duration:26s;animation-delay:5.5s;top:-10px;left:72px;transform:scale(.85)}
@keyframes bFly {
  0%{transform:translateX(0) translateY(0);opacity:0}4%{opacity:1}
  48%{transform:translateX(38vw) translateY(-22px)}96%{opacity:1}
  100%{transform:translateX(100vw) translateY(12px);opacity:0}
}
/* ── FIREFLIES ── */
.ls-ff { position:absolute;width:3px;height:3px;border-radius:50%;background:#aaff66;
  box-shadow:0 0 6px 3px rgba(140,255,70,.7);opacity:0;transition:opacity 3s ease;
  animation:ffFloat ease-in-out infinite, ffBlink ease-in-out infinite; }
.ls-scene.night .ls-ff { opacity:1; }
@keyframes ffFloat {
  0%,100%{transform:translate(0,0)}25%{transform:translate(14px,-20px)}
  50%{transform:translate(-10px,-32px)}75%{transform:translate(18px,-14px)}
}
@keyframes ffBlink {
  0%,100%{box-shadow:0 0 6px 3px rgba(140,255,70,.7)}
  50%{box-shadow:0 0 12px 6px rgba(140,255,70,.9)}
}

/* ════ LOGIN TOP BAR ════ */
.ls-bar {
  position:absolute;top:0;left:0;right:0;z-index:30;
  height:58px;
  background:rgba(6,18,6,.58);
  backdrop-filter:blur(22px) saturate(1.5);
  -webkit-backdrop-filter:blur(22px) saturate(1.5);
  border-bottom:1px solid rgba(100,200,100,.14);
  display:flex;align-items:center;padding:0 22px;gap:12px;
  box-shadow:0 2px 28px rgba(0,0,0,.38);
  animation:barSlideDown .6s cubic-bezier(.22,1,.36,1) .2s both;
}
@keyframes barSlideDown{from{transform:translateY(-100%);opacity:0}to{transform:translateY(0);opacity:1}}
.ls-bar-logo { display:flex;align-items:center;gap:9px;flex-shrink:0; }
.ls-bar-logo img { height:30px;width:auto;filter:drop-shadow(0 1px 3px rgba(0,0,0,.4)); }
.ls-bar-brand { font-size:13px;font-weight:700;color:rgba(160,240,160,.92);white-space:nowrap;line-height:1.2; }
.ls-bar-sub   { font-size:9px;font-weight:600;color:rgba(140,210,140,.48);text-transform:uppercase;letter-spacing:.1em; }
.ls-bar-sep   { width:1px;height:26px;background:rgba(100,200,100,.14);flex-shrink:0;margin:0 4px; }
.ls-bar-fields{ display:flex;align-items:center;gap:8px;flex:1;justify-content:center; }
.ls-bar-fields input {
  height:34px;padding:0 15px;
  background:rgba(255,255,255,.07);border:1px solid rgba(100,200,100,.18);
  border-radius:20px;color:#fff;font-size:12px;font-family:inherit;outline:none;
  width:205px;transition:all .2s;
}
.ls-bar-fields input::placeholder{color:rgba(255,255,255,.28);}
.ls-bar-fields input:focus{background:rgba(255,255,255,.12);border-color:rgba(120,220,120,.42);width:224px;box-shadow:0 0 0 3px rgba(60,180,60,.1);}
.ls-bar-remember { display:flex;align-items:center;gap:5px;flex-shrink:0;cursor:pointer; }
.ls-bar-remember input[type=checkbox] { width:14px;height:14px;accent-color:#2d8a2d;cursor:pointer; }
.ls-bar-remember span { font-size:11px;color:rgba(200,240,200,.55);white-space:nowrap; }
#ls-signin-btn {
  height:34px;padding:0 18px;
  background:linear-gradient(135deg,#2a8a2a,#1c6a1c);border:none;border-radius:20px;
  color:#fff;font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;flex-shrink:0;
  box-shadow:0 2px 12px rgba(30,120,30,.4);letter-spacing:.04em;transition:all .18s;white-space:nowrap;
}
#ls-signin-btn:hover{background:linear-gradient(135deg,#38aa38,#2a8a2a);transform:translateY(-1px);}
#ls-signin-btn:disabled{opacity:.6;cursor:not-allowed;transform:none;}
.ls-bar-help { font-size:10px;color:rgba(255,255,255,.16);white-space:nowrap;flex-shrink:0; }
#ls-err-bar {
  position:absolute;top:60px;left:50%;transform:translateX(-50%);
  background:rgba(180,30,30,.78);backdrop-filter:blur(10px);
  border:1px solid rgba(255,100,100,.22);border-radius:20px;
  color:rgba(255,210,210,.95);font-size:11px;font-weight:500;
  padding:6px 18px;white-space:nowrap;z-index:31;
  display:none;animation:fadeUp .2s ease;
}
#ls-err-bar.show{display:block;}
@keyframes fadeUp{from{opacity:0;transform:translateX(-50%) translateY(6px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* ════ EMPLOYEE DASHBOARD ════ */
.emp-dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.emp-action-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:18px 20px;cursor:pointer;transition:all .18s;box-shadow:var(--sh);display:flex;align-items:center;gap:14px;text-align:left}
.emp-action-card:hover{transform:translateY(-2px);box-shadow:var(--shm);border-color:var(--border2)}
.eac-primary{background:var(--swl-green)!important;color:#fff!important;border-color:var(--swl-green)!important}
.eac-primary:hover{background:var(--swl-green2)!important}
.eac-icon{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.eac-primary .eac-icon{background:rgba(255,255,255,.15)}
.eac-title{font-size:13px;font-weight:600;margin-bottom:2px}
.eac-sub{font-size:11px;opacity:.68}

/* ════ BADGES ════ */
.badge-chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;border:1px solid;white-space:nowrap}
.badge-chip.gold{background:#FFF8E1;color:#F57F17;border-color:#FFD54F}
.badge-chip.silver{background:#F5F5F5;color:#546E7A;border-color:#B0BEC5}
.badge-chip.green{background:var(--success-l);color:var(--success);border-color:#A7F3D0}
.badge-chip.blue{background:var(--info-l);color:var(--info);border-color:#BFDBFE}
.badge-chip.purple{background:var(--critical-l);color:var(--critical);border-color:#DDD6FE}
.badges-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;margin-bottom:12px}
.greeting-main{font-size:24px;font-weight:700;color:var(--text);letter-spacing:-.4px;margin-bottom:2px}
.greeting-sub{font-size:13px;color:var(--text3);margin-bottom:4px}

/* ════ MOBILE / iPAD ════ */
.mob-menu-btn{display:none;background:none;border:none;cursor:pointer;padding:6px;color:var(--text2)}
.mob-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:98}
.sidebar.mob-open{transform:translateX(0)!important}
@media(max-width:900px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:99;transform:translateX(-100%);transition:transform .25s}
  .mob-menu-btn{display:flex;align-items:center;justify-content:center}
  .cards-row{grid-template-columns:1fr}
  .g2,.g3,.g4{grid-template-columns:1fr 1fr}
  .content-area{padding:14px}
  .btn{min-height:40px}.btn.sm{min-height:34px}
  .nav-btn{min-height:42px}
  .fg input,.fg select{padding:11px 12px;font-size:15px}
  .ls-bar{height:auto;flex-wrap:wrap;padding:10px 14px;gap:8px}
  .ls-bar-fields{flex-wrap:wrap;width:100%;justify-content:flex-start}
  .ls-bar-fields input{width:100%!important}
  #ls-signin-btn{width:100%}
  .ls-bar-sep{display:none}
}
@media(max-width:600px){
  .stats-grid{grid-template-columns:1fr 1fr}
  .emp-dash-grid{grid-template-columns:1fr}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .content-area{padding:12px}
}
@media(min-width:768px) and (max-width:1024px) and (orientation:landscape){
  .stats-grid{grid-template-columns:repeat(4,1fr)}
  .emp-dash-grid{grid-template-columns:repeat(3,1fr)}
}



/* ═══ GREY THEME READABILITY — status colors always visible ═══ */
/* Status indicator colors — always visible regardless of theme */
.status-open        { color: #60A5FA !important; }  /* Blue */
.status-in-progress { color: #FBBF24 !important; }  /* Amber */
.status-completed   { color: #7DC855 !important; }  /* Green */
.status-overdue     { color: #F87171 !important; }  /* Red */
.status-carried     { color: #C084FC !important; }  /* Purple */
.status-draft       { color: #A0A0A0 !important; }  /* Grey */
.status-canceled    { color: #94A3B8 !important; }
.ext-req-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;background:rgba(251,191,36,.15);color:#FBBF24;border:1px solid rgba(251,191,36,.3)}
.ext-pending-banner{background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.2);border-radius:6px;padding:6px 10px;font-size:11px;color:#FBBF24;margin-top:4px}

/* Dark mode: ensure text in content area is readable */
.content-area:not(.theme-white) { color: #E0E0E0; }
.content-area:not(.theme-white) h1,
.content-area:not(.theme-white) h2,
.content-area:not(.theme-white) h3 { color: #F0F0F0 !important; }
.content-area:not(.theme-white) label,
.content-area:not(.theme-white) .fg label { color: #999 !important; }
.content-area:not(.theme-white) input:not([type=checkbox]):not([type=radio]),

.content-area{background:var(--content-bg)!important}

.content-area.theme-white .stat-card{background:#fff!important;border-color:#E8E8E8!important}

.content-area .progress-bar{background:#2E2E2E!important}
.content-area .item-row{border-color:var(--card-border)!important}
.content-area .item-title{color:#E0E0E0!important}
.content-area .item-meta{color:#777!important}
.content-area .empty{color:#555!important}
.content-area .fg label{color:#999!important}
.content-area .fg input,.content-area .fg select,.content-area .fg textarea{background:#2A2A2A!important;border-color:#383838!important;color:#E0E0E0!important}
.content-area .section-title{color:#E0E0E0!important}

.content-area .badge.warn{background:rgba(217,119,6,.18)!important;color:#FBBF24!important;border:1px solid rgba(217,119,6,.28)!important}

/* Sidebar structure */
.sidebar{position:relative!important;overflow:hidden!important}
.sb-landmark{position:absolute;bottom:48px;left:0;right:0;height:170px;pointer-events:none;z-index:1}
.sb-landmark img{width:100%;height:100%;object-fit:cover;object-position:center top;display:none}
.sb-ov{position:absolute;inset:0;z-index:2;pointer-events:none}
.sb-inner{position:relative;z-index:3;display:flex;flex-direction:column;height:100%;overflow:hidden}
/* Nav dark */
.nav-btn{color:rgba(255,255,255,.52)!important;border-left:2px solid transparent!important}
.nav-btn:hover{color:rgba(255,255,255,.85)!important;background:rgba(255,255,255,.06)!important}
.nav-btn.active{color:#fff!important;background:rgba(255,255,255,.09)!important}
.nav-btn.active.oc-nav{border-left-color:#FC6020!important}
.nav-btn.active.la-nav{border-left-color:#1E88E5!important}
.nav-btn.active:not(.oc-nav):not(.la-nav){border-left-color:#4CAF50!important}
.sb-section-label{color:rgba(255,255,255,.22)!important}
.sb-footer{border-top-color:rgba(255,255,255,.07)!important}
.sb-week{color:rgba(255,255,255,.3)!important}
.sb-week-val{color:rgba(255,255,255,.65)!important}
.signout-btn{color:rgba(255,255,255,.38)!important}
/* Theme switcher */
.theme-sw{display:flex;gap:2px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:2px;flex-shrink:0}
.ts-opt{padding:3px 10px;font-size:10px;font-weight:600;border:none;border-radius:16px;cursor:pointer;background:none;color:rgba(255,255,255,.4)}
.ts-opt.on{background:rgba(255,255,255,.15);color:#fff}
/* Badge chips */
.badge-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:10px;font-size:10px;font-weight:600;border:1px solid;white-space:nowrap}
.badge-chip.gold{background:rgba(200,75,0,.15);color:#FC9060;border-color:rgba(200,75,0,.3)}
.badge-chip.green{background:rgba(74,138,48,.15);color:#7DC855;border-color:rgba(74,138,48,.3)}
.badge-chip.blue{background:rgba(23,95,165,.15);color:#60A5FA;border-color:rgba(23,95,165,.3)}
.badge-chip.purple{background:rgba(120,60,180,.15);color:#C084FC;border-color:rgba(120,60,180,.3)}
.badges-row{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}
/* Employee action cards */
.emp-ac{background:var(--card-bg);border:1px solid var(--card-border);border-radius:10px;padding:13px 14px;display:flex;align-items:center;gap:10px;cursor:pointer}
.emp-ac:hover{opacity:.85}
.emp-ac-icon{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.emp-ac-title{font-size:11px;font-weight:600;color:#E0E0E0;margin-bottom:2px}
.emp-ac-sub{font-size:10px;color:#666}
/* show/hide pass */
.pass-wrap{position:relative;display:flex;align-items:center}
.pass-wrap input{width:100%;padding-right:36px}
.pass-eye{position:absolute;right:10px;background:none;border:none;cursor:pointer;color:rgba(255,255,255,.5);font-size:13px;padding:0;line-height:1}

function getMonday(d) {
  const dt = new Date(d); const day = dt.getDay();
  const diff = dt.getDate() - day + (day === 0 ? -6 : 1);
  dt.setDate(diff); dt.setHours(0,0,0,0); return dt;
}
function getSaturday(m) { const d = new Date(m); d.setDate(d.getDate()+5); return d; }
function fmtDate(d) {
  if (!d) return '—';
  const dt = d instanceof Date ? d : d.toDate ? d.toDate() : new Date(d);
  return dt.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}
function fmtShort(d) {
  if (!d) return '—';
  const dt = d instanceof Date ? d : d.toDate ? d.toDate() : new Date(d);
  return dt.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
}
function weekKey(m) { return new Date(m).toISOString().split('T')[0]; }
function fmtWeek(m) { return `${fmtShort(m)} – ${fmtShort(getSaturday(m))}`; }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
/* greet defined elsewhere */
function isFriday() { return new Date().getDay()===5; }
function isMonday() { return new Date().getDay()===1; }
function getUserBranch() { return CD?.branch==='ALL' ? null : CD?.branch; }
function canView(branch) { if(!CD) return false; if(CD.role==='admin') return true; return CD.branch===branch; }

function showErr(msg) {
  const el = document.getElementById('ls-err-bar') || document.getElementById('l-err');

  if (!msg) { el.style.display='none'; el.classList.remove('show'); return; }

  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.display='none'; el.classList.remove('show'); }, 5000);
}

async function doLogin() {
  showErr('');
  const emailEl = document.getElementById('l-email');
  const passEl  = document.getElementById('l-pass');
  const remEl   = document.getElementById('l-remember');
  const btn     = document.getElementById('ls-signin-btn');
  const email   = emailEl ? emailEl.value.trim() : '';
  const pass    = passEl  ? passEl.value : '';
  if (!email || !pass) { showErr('Please enter your email and password.'); return; }
  if (btn) { btn.textContent='Signing in…'; btn.disabled=true; }
  try {
    const persist = remEl && remEl.checked ? 'LOCAL' : 'SESSION';
    await auth.setPersistence(persist === 'LOCAL'
      ? firebase.auth.Auth.Persistence.LOCAL
      : firebase.auth.Auth.Persistence.SESSION);
    const cred = await auth.signInWithEmailAndPassword(email, pass);
    const snap = await db.collection('users').doc(cred.user.uid).get();
    if (!snap.exists) {
      showErr('User profile not found. Contact admin.');
      await auth.signOut();
      if (btn) { btn.textContent='Sign In →'; btn.disabled=false; }
      return;
    }
    CD = snap.data();
    if (!CD.active) {
      showErr('Your account is disabled. Contact admin.');
      await auth.signOut();
      if (btn) { btn.textContent='Sign In →'; btn.disabled=false; }
      return;
    }
    CU = cred.user;
    // Save remembered email
    if (remEl && remEl.checked) {
      localStorage.setItem('swl_remembered_email', email);
      localStorage.setItem('swl_remember_me', '1');
    } else {
      localStorage.removeItem('swl_remembered_email');
      localStorage.removeItem('swl_remember_me');
    }
    enterApp();
  } catch(e) {
    const msgs = {
      'auth/invalid-credential':'Incorrect email or password.',
      'auth/user-not-found':'No account found with that email.',
      'auth/wrong-password':'Incorrect password.',
      'auth/too-many-requests':'Too many attempts. Please wait a few minutes.',
      'auth/network-request-failed':'Network error. Check your connection.'
    };
    showErr(msgs[e.code] || ('Error: ' + e.message));
    if (btn) { btn.textContent='Sign In →'; btn.disabled=false; }
  }
}

// MANUAL SIGN-IN ONLY — only auto-enter if Remember Me was checked

auth.onAuthStateChanged(async user => {
  const remembered = localStorage.getItem('swl_remember_me') === '1';

      + "<div class='badges-row'>" + renderBadgeChips(ub) + "</div>"

      + "<div class='emp-ac' data-nav='friday-recap'><div class='emp-ac-icon' style='background:rgba(217,119,6,.14)'>&#128197;</div><div><div class='emp-ac-title'>Friday recap</div><div class='emp-ac-sub'>End-of-week review</div></div></div>"
      + "<div class='emp-ac' data-nav='my-history'><div class='emp-ac-icon' style='background:rgba(23,95,165,.14)'>&#128218;</div><div><div class='emp-ac-title'>My submissions</div><div class='emp-ac-sub'>View history</div></div></div>"
      + "<div class='emp-ac' data-nav='items'><div class='emp-ac-icon' style='background:" + acBg + "'>&#9989;</div><div><div class='emp-ac-title'>Weekly deadlines</div><div class='emp-ac-sub'>View &amp; track items</div></div></div>"
      + "<div class='emp-ac' data-nav='summary' style='border-top:2px solid " + accent + "'><div class='emp-ac-icon' style='background:" + acBg + "'>&#128101;</div><div><div class='emp-ac-title'>Team Monday recap</div><div class='emp-ac-sub'>" + bl + " overview</div></div></div>"
      + "<div class='emp-ac' data-nav='friday-summary' style='border-top:2px solid " + accent + "'><div class='emp-ac-icon' style='background:" + acBg + "'>&#128202;</div><div><div class='emp-ac-title'>Friday summary</div><div class='emp-ac-sub'>" + bl + " end-of-week</div></div></div>"
      + "</div>"

    ca.querySelectorAll("[data-nav]").forEach(function(el){

      .map(function(t){return t.name.split(" ")[0];}).slice(0,3).join(", ");
    var nudge = pc>0

      : "<strong style='color:#7DC855'>All " + tc + " team members</strong> submitted this week!";

    ca.innerHTML =
      "<div style='margin-bottom:16px'>"
      + "<div class='dash-greeting'>" + greet() + ", " + esc(firstName) + "!</div>"
      + "<div class='dash-sub'>" + ((ROLES[CD.role]&&ROLES[CD.role].label)||CD.role) + " · " + bl + " · " + fmtWeek(CW) + "</div>"
      + "<div class='badges-row'>" + renderBadgeChips(ub) + "</div>"
      + "<div style='background:" + acBg + ";border-left:3px solid " + accent + ";border-radius:8px;padding:10px 13px;display:flex;align-items:center;gap:9px;margin-top:8px'>"

      + "<div class='progress-bar' style='height:6px'><div class='progress-fill " + (isOC?"oc":isLA?"la":"green") + "' style='width:" + pct + "%'></div></div></div>"

async function loadMyRecentHistory() {
  // Load last 8 weeks of submissions for this user
  const snap = await db.collection('weekly_submissions')
    .where('userId','==',CU.uid)
    .get();
  const subs = snap.docs.map(d=>({id:d.id,...d.data()}))
    .sort((a,b)=>(b.weekStart||'').localeCompare(a.weekStart||''))
    .slice(0,8);

  if (!subs.length) return;

  const ca = document.getElementById('content-area');
  if (!ca) return;

  const historyHtml = `
    <div class="card" style="margin-top:16px">
      <div class="card-header">
        <div class="card-title">📚 My Recent Submissions</div>
        <button class="btn sm" onclick="navigateTo('my-history')">View all →</button>
      </div>
      ${subs.map(s => {
        const isCurrent = s.weekStart === weekKey(CW);
        return `<div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)">
          <div style="width:8px;height:8px;border-radius:50%;background:${s.status==='submitted'?'var(--success)':'var(--warn)'};flex-shrink:0"></div>
          <div style="flex:1">
            <div style="font-size:13px;font-weight:${isCurrent?'700':'500'};color:${isCurrent?'var(--swl-green)':'var(--text)'}">
              ${s.formType?.toUpperCase()||'Check-in'} — Week of ${s.weekStart||'—'}
              ${isCurrent?'<span style="font-size:10px;background:var(--swl-green);color:#fff;padding:1px 6px;border-radius:10px;margin-left:6px">Current</span>':''}
            </div>
            <div style="font-size:11px;color:var(--text3);margin-top:1px">${s.branch} · ${s.status==='submitted'?'Submitted':'Draft'}</div>
          </div>
          <span class="badge ${s.status==='submitted'?'success':'warn'}">${s.status==='submitted'?'✓':'Draft'}</span>
        </div>`;
      }).join('')}
    </div>`;

  // Append to content area
  ca.insertAdjacentHTML('beforeend', historyHtml);
}

function getFirstCheckinRole() {
  // If user has a specific formType assigned (e.g. extra client rep), use that
  if (CD?.formType) return CD.formType;
  const r = CD?.role;
  if (r==='branch_manager') return 'bm';
  if (r==='ops_manager') return 'om';
  if (r==='ops_specialist') return 'os';
  if (r==='irrigation_supervisor') return 'sv';
  if (r==='client_rep') return CD?.branch==='LA' ? 'cr-la' : 'cr-oc';
  return 'bm';
}

function getWeekNum(d) {
  const start = new Date(d.getFullYear(),0,1);
  return Math.ceil((((d-start)/86400000)+start.getDay()+1)/7);
}

async function loadCarryoverForDash(branch) {
  let q = db.collection('weekly_items').where('status','==','not_completed');
  if (branch) q = q.where('branch','==',branch);
  const snap = await q.get();
  document.getElementById('ds-carryover').textContent = snap.size;
  const el = document.getElementById('dash-co-list');
  if (!el) return;
  if (snap.empty) { el.innerHTML='<div class="empty"><span class="empty-icon">✓</span>No carry-over items</div>'; return; }
  el.innerHTML = snap.docs.slice(0,5).map(d => {
    const it = d.data();
    return `<div class="item-row">
      <span class="priority-dot ${it.priority||'medium'}"></span>
      <div class="item-content">
        <div class="item-title">${esc(it.title)}</div>
        <div class="item-meta">${esc(it.ownerName)} · Was due ${fmtDate(it.deadline)}${it.fridayReview?.reason ? ' · ' + esc(it.fridayReview.reason) : ''}</div>
        ${it.fridayReview?.newDeadline ? `<div style="font-size:11px;color:var(--info);margin-top:2px">New deadline: ${fmtDate(it.fridayReview.newDeadline)}</div>` : ''}
        ${it.needsAssistance ? `<div style="font-size:11px;color:var(--danger);margin-top:2px;font-weight:600">⚠ ${it.assistanceLevel==='upper_management'?'Upper management':'Branch manager'} assistance needed</div>` : ''}
      </div>
      <span class="badge ${it.needsAssistance?'danger':'warn'}">Carry-over${it.needsAssistance?' · Help needed':''}</span>
    </div>`;
  }).join('') + (snap.size>5?`<div style="padding:8px 0;font-size:12px;color:var(--text3)">+${snap.size-5} more…</div>`:'');
}

async function loadTeamStatus(branch, wk) {
  const el = document.getElementById('dash-team-list');
  if (!el) return;
  let q = db.collection('weekly_submissions').where('weekStart','==',wk);
  if (branch) q = q.where('branch','==',branch);
  const snap = await q.get();
  // Build a map of submitted emails and userIds
  const submittedEmails = new Set(snap.docs.filter(d=>d.data().status==='submitted').map(d=>d.data().userEmail));
  const submittedNames  = new Set(snap.docs.filter(d=>d.data().status==='submitted').map(d=>d.data().userName));
  const roleOrder2 = {branch_manager:0, ops_manager:1, ops_specialist:1, irrigation_supervisor:2, client_rep:3};
  const teamToShow = TEAM
    .filter(t => (!branch||t.branch===branch||branch==='ALL') && t.role!=='admin')
    .sort((a,b) => (roleOrder2[a.role]||5) - (roleOrder2[b.role]||5));
  // Load photos
  const photoMap = {};
  try {
    const uSnap = await db.collection('users').get();
    uSnap.docs.forEach(d=>{ const u=d.data(); if(u.photoURL){photoMap[u.email]=u.photoURL; photoMap[u.name]=u.photoURL;}});
  } catch(e){}
  el.innerHTML = teamToShow.map(t => {
    const done = submittedEmails.has(t.email) || submittedNames.has(t.name);
    const photo = photoMap[t.email] || photoMap[t.name];
    const avatar = photo
      ? `<img src="${photo}" style="width:30px;height:30px;border-radius:50%;object-fit:cover;flex-shrink:0;border:2px solid var(--border)">`
      : `<div class="tmr-avatar" style="background:${t.color};color:#fff">${t.initials}</div>`;
    return `<div class="team-member-row">
      ${avatar}
      <div style="flex:1">
        <div class="tmr-name">${esc(t.name)}</div>
        <div class="tmr-role">${ROLES[t.role]?.label||t.role} · ${t.branch}</div>
      </div>
      <span class="badge ${done?'success':'warn'}">${done?'✓ Done':'Pending'}</span>
    </div>`;
  }).join('');
}

        <span style="font-size:11px;color:var(--text3)">Language / Idioma:</span>
        <button onclick="toggleLanguage('${type}')" class="btn sm" style="background:${useSpanish?'var(--la)':'var(--surface)'};color:${useSpanish?'#fff':'var(--text)'};border-color:${useSpanish?'var(--la)':'var(--border2)'}">
          ${useSpanish?'🇲🇽 Español':'🇺🇸 English'}

    <div style="margin:12px 0;padding:12px;background:rgba(74,138,48,.06);border:1px solid rgba(74,138,48,.12);border-radius:8px">
      <div style="font-size:10px;font-weight:700;color:#777;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between">
        <span>📋 My Weekly Items — Update Status</span>
        <span style="font-size:10px;font-weight:400;color:#999;text-transform:none">Assigned to you this week</span>
      </div>

    </div>

function togglePass() {
  const inp = document.getElementById('l-pass');
  const btn = document.getElementById('pass-eye');
  if (!inp) return;
  const showing = inp.type === 'text';
  inp.type = showing ? 'password' : 'text';
  btn.style.color = showing ? 'rgba(255,255,255,.45)' : 'rgba(255,255,255,.85)';
  btn.innerHTML = showing ? '&#128065;' : '&#128273;';
}

function toggleLanguage(type) {
  const current = localStorage.getItem('swl-lang-' + CU.uid);
  localStorage.setItem('swl-lang-' + CU.uid, current === 'es' ? 'en' : 'es');
  renderCheckin(type); // re-render with new language
}

function buildCheckinForm(type, data, useSpanish) {
  const d = data || {};
  const v = (key, fallback='') => esc(d[key]||fallback);
  const sp = useSpanish; // Spanish mode flag
  const ta = (id, label, placeholder, rows=3) =>
    `<div class="fg"><label>${label}</label><textarea id="f-${id}" rows="${rows}" placeholder="${placeholder}">${v(id)}</textarea></div>`;
  const inp = (id, label, type2='text', placeholder='') =>
    `<div class="fg"><label>${label}</label><input type="${type2}" id="f-${id}" value="${v(id)}" placeholder="${placeholder}"></div>`;
  const sel = (id, label, options) =>
    `<div class="fg"><label>${label}</label><select id="f-${id}">${options.map(o=>`<option value="${o}" ${d[id]===o?'selected':''}>${o}</option>`).join('')}</select></div>`;

  // Bilingual textarea: shows EN label + ES label, accepts Spanish input
  // Browser lang tag enables auto-translate in Chrome/Edge
  const ta_es = (id, labelEn, labelEs, phEn, phEs, rows=3) => {
    const inputLang = sp ? 'es' : 'en';
    const label = sp ? `${labelEs} <span style="font-size:10px;opacity:.6">(${labelEn})</span>` : `${labelEn} <span style="font-size:10px;opacity:.6">(${labelEs})</span>`;
    const ph = sp ? phEs : phEn;
    return `<div class="fg"><label>${label}</label>
      <textarea id="f-${id}" rows="${rows}" lang="${inputLang}"
        placeholder="${ph}"
        style="border-left:3px solid var(--la)">${v(id)}</textarea>
    </div>`;
  };

  const section = (icon, title, color, body) => `
    <div class="form-section">
      <div class="form-section-hdr open" onclick="toggleSection(this)">
        <div class="fsh-left">
          <div class="fsh-icon" style="background:${color}20;color:${color}">${icon}</div>
          <div><div class="fsh-title">${title}</div></div>
        </div>
        <span class="fsh-chevron open">▾</span>
      </div>
      <div class="form-section-body open">${body}</div>
    </div>`;

  const rowTable = (id, cols, rows=2, hint='') => {
    const ncols = cols.length;
    const cls = `rt-c${ncols}`;
    const hdr = cols.map(c=>`<span>${c}</span>`).join('');
    // Store cols in global registry so onclick can retrieve without JSON in attribute
    if (!window._rtCols) window._rtCols = {};
    window._rtCols[id] = cols;
    let rowsHtml = '';
    for(let r=0;r<rows;r++){
      const vals = Array.isArray(d[id]) && typeof d[id][r] === 'string'
        ? d[id][r].split(' | ') : [];
      const cells = cols.map((c,ci)=>`<input type="text" id="f-${id}-r${r}c${ci}" value="${esc(vals[ci]||d[id]?.[r]?.[ci]||'')}" placeholder="${c}…">`).join('');
      rowsHtml+=`<div class="rt-row">${cells}</div>`;
    }
    return `<div class="row-table ${cls}" data-rt-id="${id}"><div class="rt-header">${hdr}</div>${rowsHtml}<button class="add-row-btn" onclick="addTableRow(this,'${id}')">+ Add row</button></div>${hint?`<div style="font-size:11px;color:var(--text3);margin-top:4px">${hint}</div>`:''}`;
  };

  if (type === 'bm') return `
    ${section('📊','Week at a Glance','var(--swl-green)',`
      <div class="g2">
        ${ta('bm_focus','Key focus this week','What are you focused on this week?')}
        ${sel('bm_capacity','Capacity status',['Full capacity','Slightly stretched','Very stretched','Under capacity'])}
      </div>
      ${ta('bm_priorities','Cross-branch priorities','Top priorities across OC and LA this week…',4)}
    `)}
    ${section('📅','Weekly Executive Planner','var(--swl-green)',`
      <div class="fg"><label>💡 Plan each day of your work week</label></div>
      <div class="g2">
        ${ta('bm_monday','Monday','Site visits, meetings, priorities…',2)}
        ${ta('bm_tuesday','Tuesday','Site visits, meetings, priorities…',2)}
        ${ta('bm_wednesday','Wednesday','Site visits, meetings, priorities…',2)}
        ${ta('bm_thursday','Thursday','Site visits, meetings, priorities…',2)}
        ${ta('bm_friday','Friday','Reviews, accountability, wrap-up…',2)}
        ${ta('bm_saturday','Saturday','Any weekend commitments…',2)}
      </div>
      ${ta('bm_client_walks','Client walks scheduled','Which clients are you walking this week?',2)}
      ${ta('bm_leadership_meetings','Leadership / board meetings','Any board or leadership meetings scheduled?',2)}
      ${ta('bm_high_priority_props','High-priority properties to visit','Which properties need your attention this week?',2)}
      ${ta('bm_travel','Branch travel (OC ↔ LA)','Any planned travel between branches?',2)}
    `)}
    ${section('⚠','Escalations & Risks','var(--danger)',`
      ${ta('bm_escalations','Escalations this week','What needs to be escalated to VP or ownership?',3)}
      ${ta('bm_risks','Operational risks','Any risks that could impact operations?',2)}
      ${ta('bm_followups','Planned follow-ups','Key follow-up actions from last week…',2)}
    `)}
    ${section('👥','Staffing & Team','var(--swl-green)',`
      ${ta('bm_headcount','Headcount status','Any gaps, coverage issues, or needs?',2)}
      ${ta('bm_coaching','Coaching notes','Notes on team development or performance coaching…',3)}

function addTableRow(btn, id) {
  const container = btn.closest('.row-table');
  if (!container) return;
  const cols = (window._rtCols && window._rtCols[id]) || [];
  if (!cols.length) { console.warn('No cols found for', id); return; }
  const rows = container.querySelectorAll('.rt-row').length;
  const newRow = document.createElement('div');
  newRow.className = 'rt-row';
  newRow.innerHTML = cols.map((c,ci) =>
    `<input type="text" id="f-${id}-r${rows}c${ci}" placeholder="${c}…" style="font-size:12px;padding:5px 7px;border:1px solid var(--border2);border-radius:4px;background:var(--surface2);color:var(--text);width:100%;font-family:inherit">`
  ).join('');
  container.insertBefore(newRow, btn);
  // Ensure grid columns inherit from parent class
  const cls = container.className.match(/rt-c\d+/)?.[0];
  if (cls) newRow.style.cssText = `display:grid;gap:8px;padding:6px 8px;border:1px solid var(--border);border-top:none;background:var(--surface);grid-template-columns:${cls==='rt-c4'?'2fr 1fr 1fr 1fr':cls==='rt-c3'?'2fr 1fr 1fr':'1fr 1fr'}`;
}

async function submitCheckin(type, existingId, status) {
  const fields = collectFormFields();
  const wk = weekKey(CW);
  const data = {
    userId: CU.uid,
    userEmail: CU.email,
    userName: CD.name,
    branch: type.includes('oc')||type==='om' ? 'OC' : type.includes('la')||type==='os'||type==='sv' ? 'LA' : CD.branch,
    role: CD.role,
    formType: type,
    weekStart: wk,
    weekEnd: weekKey(getSaturday(CW)),
    status,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    ...fields
  };
  if (!existingId) data.createdAt = firebase.firestore.FieldValue.serverTimestamp();

  try {
    if (existingId) {
      await db.collection('weekly_submissions').doc(existingId).update(data);
    } else {
      await db.collection('weekly_submissions').add(data);
    }
    toast(status==='submitted' ? randomSubmitMsg() : '✓ Draft saved');
    if (status === 'submitted') navigateTo('dashboard');
  } catch(e) {
    toast('Error saving: ' + e.message, 'err');
  }
}

function collectFormFields() {
  const result = {};
  // First pass: gather all row-table fields grouped by table key and row index
  const rowData = {};
  document.querySelectorAll('#checkin-form-body [id^="f-"]').forEach(el => {
    const key = el.id.replace('f-','');
    const match = key.match(/^(.+)-r(\d+)c(\d+)$/);
    if (match) {
      const [,tableKey,rowIdx,colIdx] = match;
      if (!rowData[tableKey]) rowData[tableKey] = {};
      if (!rowData[tableKey][+rowIdx]) rowData[tableKey][+rowIdx] = {};
      rowData[tableKey][+rowIdx][+colIdx] = el.value.trim();
    } else {
      result[key] = el.value.trim();
    }
  });
  // Second pass: convert row data to flat array of objects (no nested arrays)
  // Firestore does not support nested arrays
  Object.entries(rowData).forEach(([tableKey, rows]) => {
    const flatRows = Object.values(rows)
      .map(cols => Object.values(cols).join(' | '))
      .filter(r => r.replace(/\s*\|\s*/g,'').trim());
    if (flatRows.length) result[tableKey] = flatRows; // array of strings, not arrays
  });
  return result;
}

async function saveManagerCarryoverUpdate(id) {
  const note = document.getElementById('mco-note').value.trim();
  const newDeadline = document.getElementById('mco-deadline').value;
  const assistanceLevel = document.getElementById('mco-assist').value;
  const colorStatus = document.getElementById('mco-color').value;
  if (!note) { toast('Please add a note','err'); return; }
  const update = {
    managerUpdate: {
      note, newDeadline, assistanceLevel, colorStatus,
      by: CD.name, role: CD.role,
      ts: new Date().toLocaleString()
    },
    colorStatus,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  };
  if (newDeadline) update.deadline = newDeadline;
  if (assistanceLevel !== 'none') { update.needsAssistance = true; update.assistanceLevel = assistanceLevel; }
  await db.collection('weekly_items').doc(id).update(update);
  document.getElementById('mgr-co-modal').remove();
  toast('✓ Manager update saved');
